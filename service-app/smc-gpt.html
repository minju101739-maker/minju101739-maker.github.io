<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMC-GPT · 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7FAFF; --paper:#FFFFFF; --paper2:#EDF2FB; --sunken:#F1F5FC;
  --ink:#1E2A3C; --ink2:#54627B; --ink3:#8B97AD; --line:#E5EAF4; --line2:#D2DCEE;
  --brand:#2E5BFF; --brand-deep:#1E43E0; --brand-soft:#EAF0FF;
--viz1:#2E5BFF;--viz2:#12B5A5;--viz3:#7C5CFC;--viz4:#B8C2D6; --brand-soft2:#D7E2FF;
  --m-admin:#00B5A5; --m-admin-soft:#DDF8F4;
  --wash:radial-gradient(1000px 560px at 78% -12%, color-mix(in srgb, var(--mode) 13%, transparent) 0%, transparent 62%),
        radial-gradient(760px 480px at 8% 112%, rgba(255,214,222,.30) 0%, transparent 55%),
        linear-gradient(180deg, #FBFDFF 0%, #F3F7FF 100%);
  --m-clin:#F97316; --m-clin-soft:#FFEFE1;
  --m-res:#8B5CF6; --m-res-soft:#F0EAFF;
  --warn:#E8590C; --warn-soft:#FFF0E3; --danger:#E5484D; --danger-soft:#FDEBEC; --ok:#00A76F;
  --shadow:0 1px 2px rgba(24,37,41,.06),0 6px 24px -8px rgba(24,37,41,.10);
  --shadow-lg:0 8px 40px -8px rgba(24,37,41,.22);
  --r-s:8px; --r-m:12px; --r-l:16px;
  --mode:#2E5BFF; --mode-soft:#EAF0FF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="__off1"]{
    --bg:#0E141B; --paper:#151D26; --paper2:#1C2631; --sunken:#121A22;
    --ink:#E6EBF1; --ink2:#9DACBC; --ink3:#6D7C8C; --line:#263340; --line2:#31414F;
    --brand:#6E93FF; --brand-deep:#93AFFF; --brand-soft:#17233F;
--viz1:#6E93FF;--viz2:#3AC7B7;--viz3:#A48CFF;--viz4:#4A5568; --brand-soft2:#1E2F55;
    --m-admin:#2DD4BF; --m-admin-soft:#0E3330;
  --wash:linear-gradient(180deg,#10161F 0%, #0E141B 100%);
    --m-clin:#FB923C; --m-clin-soft:#3B2410;
    --m-res:#A78BFA; --m-res-soft:#2A2150;
    --warn:#D8A24A; --warn-soft:#332711; --danger:#E06B5D; --danger-soft:#3A1B17; --ok:#46B383;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px -8px rgba(0,0,0,.4);
    --shadow-lg:0 8px 40px -8px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --paper:#151D26; --paper2:#1C2631; --sunken:#121A22;
  --ink:#E6EBF1; --ink2:#9DACBC; --ink3:#6D7C8C; --line:#263340; --line2:#31414F;
  --brand:#6E93FF; --brand-deep:#93AFFF; --brand-soft:#17233F; --brand-soft2:#1E2F55;
  --m-admin:#2DD4BF; --m-admin-soft:#0E3330;
  --m-clin:#FB923C; --m-clin-soft:#3B2410;
  --m-res:#A78BFA; --m-res-soft:#2A2150;
  --warn:#D8A24A; --warn-soft:#332711; --danger:#E06B5D; --danger-soft:#3A1B17; --ok:#46B383;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px -8px rgba(0,0,0,.4);
  --shadow-lg:0 8px 40px -8px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
.panel{padding:16px 18px}
.page-h{margin-bottom:14px}
.kpi2 .k-v{font-size:26px}
.bar-chart,.week-bars{min-height:170px}
.gauge svg{width:150px;height:150px}
body.p1 .p2only{display:none!important}
.tabs button .tl{font-size:14.5px}
.top-right{gap:6px}
.mode-sw,.model-sw{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.kpi2 .k-s{white-space:normal}
@media (max-width:1366px){ .grid3{grid-template-columns:1fr 1fr} .pg-search{width:240px} }
body{
  font-family:"Pretendard Variable",Pretendard,"IBM Plex Sans KR",-apple-system,"Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--ink); font-size:18px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  word-break:keep-all; overflow-wrap:break-word;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--ink)}
input,textarea,select{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 10px;outline:none;transition:border-color .12s, box-shadow .12s;box-sizing:border-box;max-width:100%}
.modal-b textarea{width:100%;display:block;resize:vertical;min-height:64px}
.modal-b .fld>input:not([type="file"]),.modal-b .fld>select{width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:var(--brand-soft2)}
svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- 로그인 ---------- */
#login{position:fixed;inset:0;display:flex;z-index:100;background:var(--bg)}
.login-side{flex:1.15;background:linear-gradient(160deg,#083A78 0%,#0D5CB1 55%,#1873CC 100%);color:#EAF1FA;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-side::after{content:"";position:absolute;inset:0;background:
  none;pointer-events:none}
.login-side .wordmark{font-size:17px;font-weight:600;letter-spacing:.02em;opacity:.9}
.login-side h1{font-size:clamp(30px,3.6vw,44px);font-weight:700;line-height:1.28;letter-spacing:-.02em;max-width:15em}
.login-side h1 em{font-style:normal;border-bottom:4px solid rgba(255,255,255,.4)}
.login-side .foot{font-size:14px;opacity:.72;line-height:1.7}
.login-main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
.login-card{width:380px;max-width:100%}
.login-card h2{font-size:23px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.login-card .sub{color:var(--ink2);margin-bottom:26px}
.sso-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;background:var(--ink);color:var(--bg);border-radius:var(--r-m);font-weight:600;font-size:17px;transition:transform .08s}
.sso-btn:active{transform:scale(.985)}
.login-div{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:13.5px;margin:20px 0}
.login-div::before,.login-div::after{content:"";flex:1;height:1px;background:var(--line)}
.login-card label{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
.login-card input{width:100%}
.login-card input+input{margin-top:10px}
.alt-btn{width:100%;margin-top:16px;padding:11px;border:1.5px solid var(--line2);border-radius:var(--r-m);font-weight:600;transition:border-color .12s,background .12s}
.alt-btn:hover{border-color:var(--brand);background:var(--brand-soft)}
.login-note{margin-top:18px;font-size:13.5px;color:var(--ink3);line-height:1.6}

/* ---------- 앱 셸 ---------- */
#app{display:none;height:100%;flex-direction:column}
#app.on{display:flex}
header.top{display:flex;align-items:center;gap:6px;height:54px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line);flex:none;z-index:30}
.wordmark2{display:flex;align-items:flex-end;gap:8px;margin-right:14px;white-space:nowrap}
.wordmark2 b{font-size:19px;font-weight:900;font-style:italic;letter-spacing:-.04em;color:var(--brand)}
.wordmark2 span{font-size:13.5px;color:var(--ink3);font-weight:500}
nav.tabs{display:flex;gap:2px;height:100%}
nav.tabs button{position:relative;padding:0 13px;font-weight:500;color:var(--ink2);font-size:15.5px;display:flex;align-items:center;gap:6px;border-radius:0;transition:color .12s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--brand-deep);font-weight:600}
nav.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;background:var(--brand);border-radius:2px 2px 0 0}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.mode-pill{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;border-radius:99px;font-size:14px;font-weight:600;background:var(--mode-soft);color:var(--mode);border:1px solid color-mix(in srgb,var(--mode) 26%, transparent)}
.mode-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--mode)}
.tok-widget{display:flex;align-items:center;gap:8px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:var(--paper);font-size:13.5px;color:var(--ink2);transition:border-color .12s}
.tok-widget:hover{border-color:var(--brand)}
.tok-bar{width:52px;height:5px;border-radius:3px;background:var(--paper2);overflow:hidden}
.tok-bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s}
.icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-s);color:var(--ink2);position:relative;transition:background .12s}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn .badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--paper);line-height:1}
#notiDrawer{position:fixed;inset:0;z-index:140;pointer-events:none}
#notiDrawer .nd-bg{position:absolute;inset:0;background:rgba(20,30,50,0);transition:background .2s}
#notiDrawer .nd{position:absolute;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--paper);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s var(--e-out)}
#notiDrawer.on{pointer-events:auto}
#notiDrawer.on .nd-bg{background:rgba(20,30,50,.18)}
#notiDrawer.on .nd{transform:none}
.nd-h{display:flex;align-items:center;gap:8px;padding:16px 16px 10px}
.nd-h b{font-size:18px}
.nd-read{font-size:13.5px;color:var(--brand-deep);font-weight:600}
.nd-seg{margin:0 16px 8px}
.nd-b{flex:1;overflow-y:auto;padding:0 8px 8px}
.nd-g{font-size:12.5px;font-weight:800;color:var(--ink3);padding:12px 8px 4px}
.nd-item{display:flex;gap:11px;align-items:flex-start;padding:10px 8px;border-radius:10px;cursor:pointer;position:relative}
.nd-item:hover{background:var(--sunken)}
.nd-item.unread{background:color-mix(in srgb,var(--brand) 5%,transparent)}
.nd-item .ni{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.nd-t{flex:1;min-width:0}
.nd-tx{font-size:15px;line-height:1.5;color:var(--ink2)}
.nd-item.unread .nd-tx{color:var(--ink)}
.nd-tx b{color:var(--ink)}
.nd-m{font-size:12.5px;color:var(--ink3);margin-top:2px}
.nd-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none;margin-top:6px}
.nd-f{font-size:12.5px;color:var(--ink3);padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:5px;align-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em}
main#views{flex:1;min-height:0;display:flex}
.view{flex:1;min-width:0;display:none;background:var(--wash)}
.view.on{animation:vin .22s var(--e-out)}
@keyframes vin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.view.on{display:flex}

/* ---------- 공용 컴포넌트 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid transparent;transition:filter .1s,background .12s,border-color .12s;white-space:nowrap}
.btn:active{filter:brightness(.94)}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep)}
:root[data-theme="__off2"] .btn.pri{color:#0F1619}
.btn.pri{color:#fff}
.btn.sec{background:var(--sunken);border-color:transparent;color:var(--ink)}
.btn.sec:hover{border-color:var(--brand);background:var(--brand-soft)}
.btn.ghost{color:var(--ink2)}
.btn.ghost:hover{background:var(--sunken);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.brand{background:var(--brand-soft);color:var(--brand-deep)}
.chip.line{border:1px solid var(--line2);color:var(--ink2)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.admin{background:var(--m-admin-soft);color:var(--m-admin)}
.chip.clin{background:var(--danger-soft);color:#C9373C}
.chip.res{background:#EDF1F6;color:#4A5A70}
.chip.official{background:var(--brand);color:#fff}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow)}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:7px;font-weight:600;font-size:14px;color:var(--ink2);transition:background .12s,color .12s}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
table.tbl th{text-align:left;font-size:13px;font-weight:600;color:var(--ink3);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr.rowbtn{cursor:pointer;transition:background .1s}
table.tbl tr.rowbtn:hover{background:var(--sunken)}
.toggle{position:relative;width:36px;height:20px;border-radius:99px;background:var(--line2);transition:background .15s;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle.on{background:var(--brand)}
.toggle.on::after{transform:translateX(16px)}
.empty{padding:36px;text-align:center;color:var(--ink3)}
.tooltip{position:fixed;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:6px;font-size:13px;pointer-events:none;z-index:200;opacity:0;transition:opacity .1s;white-space:nowrap}
.tooltip.on{opacity:1}

/* ---------- 토스트 ---------- */
#toasts{position:fixed;bottom:20px;left:20px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none;max-width:min(420px,60vw)}
.toast{pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center;animation:tin .18s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 모달 ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(14,22,25,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px)}
.modal{background:var(--paper);border-radius:18px;box-shadow:var(--shadow-lg);width:720px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;animation:min .16s ease}
@keyframes min{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal.wide{width:960px}
.modal.xl{width:960px}
.modal-h{display:flex;align-items:center;gap:10px;padding:20px 22px 8px;border-bottom:none;flex:none}
.modal-h h3{font-size:17.5px;font-weight:700;letter-spacing:-.01em}
.modal-h .x{margin-left:auto}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:14px 22px 20px;border-top:none;display:flex;gap:10px;flex:none;align-items:center}
.fold{border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-top:4px}
.fold summary{padding:11px 0;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer}
.fold[open] summary{border-bottom:1px dashed var(--line)}
.fold>.fld{padding-bottom:12px}
.modal-f .btn{flex:1;padding:12px 16px;font-size:16px}
.modal-f .btn.sec{color:var(--brand-deep)}
.fld{margin-bottom:14px}
.st-cap{font-size:12.5px;font-weight:700;color:var(--ink3);margin-bottom:5px}
.fld>label{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%}
.radio-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.radio-cards button{border:1.5px solid var(--line2);border-radius:var(--r-s);padding:9px 10px;text-align:left;font-size:14px;transition:border-color .12s,background .12s}
.radio-cards button b{display:block;font-size:15px;margin-bottom:2px}
.radio-cards button.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%, var(--paper))}

/* ---------- 채팅 레이아웃 ---------- */
#v-chat{display:none}
#v-chat.on{display:flex}
.sidebar{width:264px;flex:none;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:width .18s ease}
.sidebar.min{width:0;border-right:none;overflow:hidden}
.sidebar.min>*{opacity:0;pointer-events:none}
.sb-fold{flex:none;width:30px;height:30px;border-radius:9px;background:var(--paper);border:1px solid var(--line);color:var(--ink2);display:none;align-items:center;justify-content:center;margin-right:2px}
.sidebar.min~.chat-main .sb-fold{display:flex}
.sb-fold:hover{color:var(--brand);border-color:var(--brand)}
.sb-top{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px}
.newchat{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;background:var(--paper);color:var(--brand);border:1.5px solid var(--brand);border-radius:999px;font-weight:700;font-size:15.5px;transition:background .12s}
:root[data-theme="dark"] .newchat{background:transparent}
.newchat:hover{background:var(--brand-soft)}
.sb-search{display:flex;align-items:center;gap:7px;background:var(--sunken);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--ink3)}
.sb-search input{border:none;background:none;padding:0;flex:1;min-width:0;box-shadow:none!important;font-size:15px;text-overflow:ellipsis}
.sb-search input::placeholder,.inp::placeholder,input::placeholder,textarea::placeholder{font-size:13px;color:var(--ink3)}
.sb-body{flex:1;overflow-y:auto;padding:4px 8px 16px}
.sb-sec{font-size:12.5px;font-weight:600;color:var(--ink3);padding:12px 8px 5px;display:flex;align-items:center;gap:5px}
.sb-sec .add{margin-left:auto;color:var(--ink3);border-radius:5px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.sb-sec .add:hover{background:var(--sunken);color:var(--ink)}
.proj{border-radius:9px;margin-bottom:2px}
.proj-h{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:9px;font-weight:500;color:var(--ink2);cursor:pointer;font-size:15px}
.proj-h:hover{background:var(--sunken)}
.proj-h .cnt{margin-left:auto;font-size:12.5px;color:var(--ink3)}
.proj-kids{padding-left:14px}
.convo{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:9px;cursor:pointer;color:var(--ink2);font-size:15px;position:relative}
.convo:hover{background:var(--sunken)}
.convo.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.convo .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo .exp{font-size:11px;color:var(--ink3);font-weight:500}
.convo .pin-ic{color:var(--ink3)}
.convo .mdot{width:6px;height:6px;border-radius:50%;flex:none}
.sb-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.sb-foot button{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;color:var(--ink2);font-size:14px;text-align:left}
.hold-box{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:13px 16px}
.hold-box .hb-t{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15.5px;color:var(--warn);margin-bottom:6px}
.mode-hint{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);background:var(--brand-soft);border:1px solid var(--brand-soft2);border-radius:10px;padding:8px 12px;margin-bottom:9px}
.mode-hint span{display:inline-flex;gap:6px;align-items:center;flex:1;min-width:200px}
.mode-hint button{flex:none;font-size:13px;font-weight:700;color:var(--brand-deep);border:1px solid var(--brand-soft2);background:var(--paper);border-radius:99px;padding:4px 12px}
.mode-hint button:hover{background:var(--brand-soft2)}
.mode-hint.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink2)}
.mode-hint.warn button{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.hold-box p{font-size:15px;line-height:1.7;margin:4px 0 0}
.kb-doc.hl{outline:2px solid var(--brand);outline-offset:1px;border-radius:9px}
.kb-card.hl{outline:2px solid var(--brand);outline-offset:2px;transition:outline-color .3s}
.perm-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin-bottom:10px}
.perm-banner span{display:inline-flex;gap:4px;padding-left:10px;border-left:1px solid var(--line)}
.idx.pend{font-size:11px;color:var(--m-clin);background:var(--m-clin-soft);border-radius:5px;padding:2px 7px;font-weight:700}
.ex-chat{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sunken)}
.exc-u{align-self:flex-end;max-width:88%;background:#E6EBF5;border:1px solid #D4DCEA;color:var(--ink);border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:13.5px;line-height:1.6}
:root[data-theme="dark"] .exc-u{background:#24304A;border-color:#33405C}
.exc-a{display:flex;gap:8px;font-size:13.5px;line-height:1.6;color:var(--ink)}
.exc-a>div{background:var(--paper);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px}
.exc-dot{width:16px;height:16px;flex:none;margin-top:2px;display:inline-flex;align-items:center;justify-content:center}
.quick-list{display:flex;flex-direction:column;gap:1px;padding:0 6px 4px}
.quick-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;font-size:14px;color:var(--ink2);text-align:left;transition:background .12s}
.quick-item:hover{background:var(--sunken);color:var(--ink)}
.quick-item .qi-ic{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.quick-item .qi-ic.ag{background:var(--brand-soft);color:var(--brand)}
.quick-item .qi-ic.ps{background:#EDF1F6;color:#56657A}
.quick-item .qi-t{margin-left:auto;font-size:11px;color:var(--ink3);flex:none}
.sb-search{box-sizing:border-box}
.pg-search{width:300px;flex:none;background:var(--paper);border-color:var(--line2);box-shadow:0 1px 2px rgba(20,40,80,.05)}
.pg-search:focus-within{border-color:var(--brand)}
/* 공통: 버튼·칩·탭·페이지 표기는 한 줄 유지 */
.seg button,.chip,.btn,.idx,.kbl-seg button,.nowrap{white-space:nowrap}
.seg-sm{font-size:12.5px;font-weight:700;color:var(--ink3);border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:2px 9px}
.seg-sm.on{color:var(--brand-deep);border-color:var(--brand-soft2);background:var(--brand-soft)}
.blk-wrap{position:relative}
.blk-wrap .blk-copy{position:absolute;top:6px;right:6px;display:none;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px 9px;box-shadow:var(--shadow);z-index:2}
.blk-wrap:hover .blk-copy{display:inline-flex}
.blk-wrap .blk-copy:hover{color:var(--brand-deep);border-color:var(--brand-soft2)}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.cmp-col{min-width:0;display:flex;flex-direction:column}
.cmp-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink3);margin-bottom:6px}
.cmp-box{border:1px solid var(--line);border-radius:12px;background:var(--sunken);padding:12px 16px;font-size:14px;line-height:1.75;max-height:340px;overflow-y:auto;flex:1;min-height:0}
.cmp-box p:first-child{margin-top:0}
.cmp-box ul,.cmp-box ol{padding-left:20px;margin:6px 0}
.cmp-box li{margin:3px 0}
.cmp-col>.btn{margin-top:8px!important}
.msg-tools.ab-wait{opacity:.4;pointer-events:none}
.qset-list{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.qset-row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;font-size:14px;background:var(--sunken)}
.qset-row.bad{background:#FFF3F0}
:root[data-theme="dark"] .qset-row.bad{background:#3a2622}
.qset-mark{flex:none;width:64px;display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:800;color:var(--ok);white-space:nowrap}
.qset-row.bad .qset-mark{color:var(--danger)}
.qset-q{flex:1;min-width:0;color:var(--ink)}
.qset-why{font-size:13px;color:var(--danger);margin-top:2px;line-height:1.5}
.qset-row .btn{opacity:0;transition:opacity .12s}
.qset-row:hover .btn,.qset-row .btn:focus{opacity:1}
.sub-tabs{display:flex;gap:4px;margin-bottom:10px}
.sub-tabs button{padding:5px 11px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--ink3);border:1px solid var(--line);white-space:nowrap}
.sub-tabs button.on{color:var(--ink);background:var(--sunken);border-color:var(--line2)}

.dv-head{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.dv-title{display:flex;align-items:center;gap:8px;min-width:0}
.dv-title>b{font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:6px}
.dv-meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dv-meta i{font-style:normal;font-weight:700;color:var(--ink3)}
.idx.out{color:var(--danger)}
.drop{border:1.5px dashed var(--line2);border-radius:12px;padding:22px 14px;text-align:center;color:var(--ink3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;background:var(--sunken);transition:border-color .12s,background .12s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop.has{border-style:solid;border-color:var(--brand-soft2);background:var(--paper);color:var(--ink)}
.drop-sub{font-size:12.5px;color:var(--ink3)}
.ex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ex-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);cursor:pointer;transition:border-color .12s,background .12s}
.ex-card:hover{border-color:var(--line2);background:var(--sunken)}
.ex-card.on{border-color:var(--brand);background:var(--brand-soft)}
.ex-card .ex-th{width:100%;height:auto;border-radius:8px;margin-bottom:2px}
.ex-card b{font-size:15.5px}
.ex-card .ex-d{font-size:13.5px;color:var(--ink2);line-height:1.55}
.ex-card .ex-w{font-size:12.5px;color:var(--brand-deep);font-weight:600;display:inline-flex;align-items:center;gap:3px;margin-top:2px}
.pp-meta{font-size:12.5px;color:var(--ink3);margin:8px 0 6px}
.pp-list{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto;padding-right:2px}
.pp-row{display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px;background:var(--paper)}
.pp-row span:last-child{font-size:13px;color:var(--ink3)}
.pp-row:hover{background:var(--sunken)}
.pp-row.on{border-color:var(--brand);background:var(--brand-soft)}
.pp-ck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.pp-row.on .pp-ck{background:var(--brand);border-color:var(--brand)}
.tool-chip.round{width:32px;height:32px;padding:0;justify-content:center;border:1px solid var(--line);border-radius:50%;color:var(--ink2)}
.tool-chip.round.soon{opacity:.45;border-style:dashed}
.tool-chip .tc-n{font-size:11px;background:var(--sunken);border-radius:99px;padding:0 6px;font-weight:700;color:var(--ink3)}
.tool-chip.on .tc-n{background:var(--paper)}
.tool-row{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:9px}
.tool-row:hover{background:var(--sunken)}
.tool-row .tr-ic{width:26px;height:26px;border-radius:8px;background:var(--sunken);display:inline-flex;align-items:center;justify-content:center;color:var(--brand-deep);flex:none;margin-top:1px}
.tool-row .tr-b{flex:1;min-width:0}
.tool-row .tr-t{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.tool-row .tr-d{font-size:13px;color:var(--ink3);margin-top:1px;line-height:1.45}
.tool-row .tr-force{font-size:12.5px;color:var(--brand-deep);font-weight:600;margin-top:4px;text-decoration:underline;text-underline-offset:2px}
.tool-row.forced{background:var(--brand-soft)}
.sw{width:34px;height:20px;border-radius:99px;background:var(--line2);position:relative;flex:none;margin-top:4px;transition:background .15s}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--brand)}
.sw.on i{left:16px}
.tool-used{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink3);margin-bottom:8px}
.tool-used b{color:var(--ink2);background:var(--sunken);border-radius:99px;padding:2px 9px;font-weight:600}
.tool-used .tu-a{color:var(--ink3);font-size:12.5px}
.mode-sw{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:5px 10px 5px 8px}
.mode-sw:hover{background:var(--sunken)}
.model-sw{color:var(--ink);font-weight:600}
.model-sw .ms-ext{font-size:10.5px;font-weight:700;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:99px;padding:1px 5px}
.kbp-g{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--ink3);margin:12px 0 6px}
.kbp-g:first-child{margin-top:0}
.kbp-g .num{background:var(--sunken);border-radius:99px;padding:0 6px;font-size:11px}
.kbp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kbp-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--paper);min-width:0}
.kbp-row:hover{background:var(--sunken)}
.kbp-row.on{border-color:var(--brand);background:var(--brand-soft)}
.kbp-row.on .pp-ck{background:var(--brand);border-color:var(--brand)}
.kbp-n{font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbp-s{font-size:12.5px;color:var(--ink3);margin-top:1px}
.kpi2{padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-height:132px}
.kpi2 .k-l{font-size:13.5px;font-weight:600;color:var(--ink3);letter-spacing:.01em}
.kpi2 .k-v{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--ink)}
.kpi2 .k-u{font-size:16px;font-weight:600;color:var(--ink3);margin-left:3px;letter-spacing:0}
.kpi2 .k-s{font-size:13.5px;color:var(--ink2)}
.kpi2 .k-bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:auto}
.kpi2 .k-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--viz1),var(--viz2))}
.kpi2 .k-split{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);margin-top:auto}
.kpi2 .k-split b{color:var(--ink2)}
.kpi2 .k-spark{display:flex;gap:5px;align-items:flex-end;height:30px;margin-top:auto}
.kpi2 .k-spark i{flex:1;background:var(--viz1);opacity:.75;border-radius:3px 3px 1px 1px;display:block}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:600;font-size:13px;border-radius:99px;padding:1px 8px 1px 5px}
.delta.up{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.delta.down{color:var(--viz2);background:color-mix(in srgb,var(--viz2) 10%,transparent)}
.delta.down svg{transform:rotate(180deg)}
.panel h3 .h-sub{font-weight:500;font-size:13px;color:var(--ink3);margin-left:4px}
.viz{width:100%;height:190px;display:block}
.viz .grid{stroke:var(--line);stroke-dasharray:3 4}
.viz .tick{font-size:11px;fill:var(--ink3);font-family:inherit}
.viz .bar rect{fill:var(--viz1);opacity:.55;transition:opacity .12s}
.viz .bar.wkend rect{fill:var(--viz4);opacity:.9}
.viz .bar.today rect{opacity:1}
.viz .bar:hover rect{opacity:1}
.viz .val{font-size:12.5px;font-weight:700;fill:var(--ink);font-family:inherit}
.stack{display:flex;height:18px;border-radius:99px;overflow:hidden;gap:2px;margin:4px 0 14px;background:var(--sunken)}
.stack i{display:block;height:100%}
.stack i:first-child{border-radius:99px 0 0 99px}
.stack i:last-child{border-radius:0 99px 99px 0}
.stack i:only-child{border-radius:99px}
.legend{display:flex;flex-direction:column;gap:9px}
.legend .lg{display:flex;align-items:center;gap:9px;font-size:15px}
.legend .lg i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .lg-n{font-weight:600;color:var(--ink)}
.legend .lg-s{font-size:13px;color:var(--ink3);flex:1}
.legend .lg b{font-size:15px}
.foot-tip{font-size:13px;color:var(--ink3);display:flex;align-items:center;gap:5px;margin-top:14px}
.eqh{min-height:300px;display:flex;flex-direction:column}
.gauge-row{display:flex;align-items:center;gap:18px}
.gauge{width:150px;height:130px;flex:none}
.gauge circle{fill:none;stroke-width:12;stroke-linecap:round}
.gauge .g-bg{stroke:var(--sunken)}
.gauge .g-fg{stroke:var(--viz1)}
.gauge .g-fg.warn{stroke:var(--warn)}
.gauge .g-v{font-size:26px;font-weight:700;fill:var(--ink);font-family:inherit}
.gauge .g-l{font-size:12.5px;fill:var(--ink3);font-family:inherit}
.g-stats{display:flex;flex-direction:column;gap:10px;flex:1}
.g-stats>div{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink3);border-bottom:1px solid var(--line);padding-bottom:7px}
.g-stats>div:last-child{border:none}
.g-stats b{color:var(--ink);font-size:16px}
.req-row .seg{display:flex;width:100%}
.req-row .seg button{flex:1;font-size:14px}
.req-h{font-size:12.5px;font-weight:800;color:var(--ink3);margin:14px 0 6px}
.req-list{max-height:112px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.req-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;padding:7px 10px;border-radius:9px;background:var(--sunken)}
.req-item .rq-d{color:var(--ink3);font-size:12.5px;width:78px;flex:none;white-space:nowrap}
.req-item .rq-r{flex:1;min-width:0;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req-item .rq-rej{width:100%;font-size:13px;color:var(--danger)}
.att-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 4px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13.5px;max-width:260px;min-width:0}
.att-chip.run{opacity:.6}
.att-chip .ax{flex:none;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.02em;color:#fff;border-radius:5px;padding:3px 5px;line-height:1}
.ax.pdf{background:#E5484D}.ax.doc{background:#2E5BFF}.ax.ppt{background:#E8590C}.ax.xls{background:#00A76F}.ax.img{background:#7C5CFC}.ax.txt{background:#8B97AD}
.att-chip .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:600;min-width:0}
.att-chip .as{color:var(--ink3);font-size:12.5px;flex:none}
.att-chip button{display:inline-flex;color:var(--ink3);border-radius:4px;flex:none}
.att-chip button:hover{color:var(--danger);background:var(--sunken)}
.att-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px}
.msg.user .att-row .att-chip{background:var(--sunken)}
.q-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:var(--paper)}
.q-card:hover{border-color:var(--line2)}
.q-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.q-meta{margin-left:auto;font-size:13px;color:var(--ink3);white-space:nowrap}
.q-body{margin:9px 0 10px}
.q-q{font-size:15.5px;color:var(--ink);line-height:1.6;display:flex;gap:5px;align-items:baseline}
.q-note{font-size:13.5px;color:var(--ink2);margin-top:5px;display:flex;gap:5px;align-items:center;line-height:1.5}
.q-acts{display:flex;gap:6px;align-items:center;padding-top:10px;border-top:1px dashed var(--line)}
.q-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 0;color:var(--ok);font-size:15px;font-weight:600}
.rx-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.rx-row>div{background:var(--sunken);border-radius:10px;padding:10px 12px}
.rx-row .k-l{font-size:12.5px;color:var(--ink3);font-weight:600}
.rx-row b{font-size:24px;letter-spacing:-.02em}
.q-hint{font-size:13px;color:var(--ink3)}
.q-what{font-size:16.5px;line-height:1.6;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.q-why{margin-top:8px;padding:9px 12px;border-left:3px solid var(--line2);background:var(--sunken);border-radius:0 9px 9px 0;font-size:15.5px;line-height:1.65;color:var(--ink)}
.q-why i{display:block;font-style:normal;font-size:12.5px;font-weight:800;color:var(--ink3);margin-bottom:2px}
.q-src{margin-top:8px;font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.q-src a{color:var(--brand-deep);text-decoration:underline;cursor:pointer;font-weight:600}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.mc-card{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--paper)}
.mc-card.off{background:var(--sunken)}
.mc-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.mc-h b{font-size:15.5px}
.mc-by{font-size:12.5px;color:var(--ink3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-h .sw{margin-top:0}
.mc-tool{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13.5px;padding:5px 6px;border-radius:7px;margin:0 -6px}
.mc-tool:hover{background:var(--sunken)}
.mc-tool.forced{background:var(--brand-soft)}
.mc-tn{font-weight:700;color:var(--ink);white-space:nowrap}
.mc-td{color:var(--ink3);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.src-pr div{margin-top:6px;white-space:pre-wrap;color:var(--ink3);font-size:12.5px;line-height:1.7}
.modal.tp{width:760px;max-width:94vw}
.tp-bd{display:grid;grid-template-columns:260px minmax(0,1fr);border-top:1px solid var(--line);height:min(440px,62vh)}
.tp-l{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tp-sr{margin:10px;display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;color:var(--ink3)}
.tp-sr input{border:none;background:none;outline:none;flex:1;padding:0;font-size:14px}
.tp-ls{overflow-y:auto;flex:1;padding:0 6px 8px}
.tp-sec{font-size:12px;color:var(--ink3);padding:8px 8px 4px;font-weight:600}
.tp-it{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:8px;cursor:pointer}
.tp-it:hover{background:var(--sunken)} .tp-it.on{background:var(--brand-soft)}
.tp-n{flex:1;min-width:0}.tp-n b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-n span,.tp-n small{display:block;font-size:12px;color:var(--ink3);margin-top:1px}
.tp-r{display:flex;flex-direction:column;min-height:0}
.tp-rh{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.tp-rt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tp-rt b{font-size:16px}
.tp-by{font-size:12.5px;color:var(--ink3)}
.tp-cnt{margin-left:auto;font-size:12.5px;color:var(--ink3)}
.modal.tp{overflow:hidden}
.tp-lock{margin:10px 18px 0;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--warn) 12%,var(--paper));color:var(--warn);font-size:13px}
.tp-fl{overflow-y:auto;flex:1;padding:4px 18px}
.tp-fn{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.tp-fn:first-child{border-top:none}
.tp-ft{display:flex;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--line);background:var(--sunken)}
.tp-sum{flex:1;font-size:13px;color:var(--ink2)}.tp-sum b{color:var(--ink)}
.sw.part{background:color-mix(in srgb,var(--brand) 45%,var(--line2))}
.sw.part i{transform:translateX(7px)}
.dd-foot{padding:8px 14px 6px;font-size:12px;color:var(--ink3);border-top:1px solid var(--line);margin-top:4px;line-height:1.5}
.tool-row.locked .sw{opacity:.55}
.ev-body{flex:1;overflow-y:auto;padding:14px 16px;font-size:14px;line-height:1.85}
.ev-p{margin:0 0 12px;color:var(--ink2)}
.ev-hl{background:#FFF6D8;color:var(--ink);font-weight:600;border-left:3px solid var(--warn);padding:11px 13px;border-radius:0 10px 10px 0;margin-left:-13px}
:root[data-theme="dark"] .ev-hl{background:#3d3520}
.mcp-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--sunken)}
.mcp-h{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:7px}
.mcp-h span{color:var(--ink3);font-size:13px}
.mcp-steps{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
.mcp-steps li{display:flex;gap:9px;align-items:flex-start}
.mcp-steps li>b{flex:none;width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.ms-t{font-size:12.5px;font-weight:700;color:var(--ink3)}
.ms-d{font-size:14px;color:var(--ink)}
.mcp-det summary{font-size:12.5px;color:var(--ink3);cursor:pointer;user-select:none}
.mcp-det summary:hover{color:var(--ink2)}
.mcp-det[open] summary{margin-bottom:4px}
.mcp-io{display:flex;gap:8px;font-size:12.5px;margin:3px 0;align-items:baseline}
.mcp-io span{flex:none;width:30px;color:var(--ink3);font-weight:700}
.mcp-io code{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11.5px;color:var(--ink2);overflow-x:auto;white-space:nowrap;max-width:100%}
.mcp-tool:hover{background:var(--brand-soft)}
.sw{width:34px;height:19px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;flex:none;transition:background .15s;display:inline-block}
.sw i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}
.sw.on i{left:17px}
/* 지식베이스 마스터-디테일 (스케일 대응) */
.kb-split{display:flex;gap:14px;align-items:stretch;height:calc(100vh - 300px);min-height:520px}
.kbl{width:322px;flex:none;border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow-y:auto;padding:6px}
.kbl-g{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3);padding:12px 10px 6px;position:sticky;top:-6px;background:var(--paper);z-index:2}
.kbl-g b{font-size:13px;color:var(--ink2)}
.kbl-g .num{background:var(--sunken);border-radius:99px;padding:0 7px;font-size:11px;font-weight:700}
.kbl-g .kbl-gd{margin-left:auto;font-size:11px;text-align:right;max-width:150px;line-height:1.4}
.kbl-row{padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .12s}
.kbl-row:hover{background:var(--sunken)}
.kbl-row.on{background:var(--brand-soft);box-shadow:inset 2.5px 0 0 var(--brand)}
.kbl-t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbl-s{font-size:12.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-detail{flex:1;min-width:0;overflow-y:auto;padding:18px 20px}
.kbl-seg{margin:6px 6px 4px;display:flex}
.kbl-seg button{flex:1;font-size:12.5px;padding:5px 2px}
.kbl-list{flex:1;overflow-y:auto;padding:0 6px 6px}
.kbl{display:flex;flex-direction:column;padding:0}
.kbl-dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.kbl-chip{font-size:10px;padding:1px 6px}
.kbl-g{margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.kbl-list .kbl-g:first-child{margin-top:0;border-top:none;padding-top:10px}
.kb-split{height:calc(100vh - 248px)}
.kb-split.doc .kbl{width:212px}
.kb-split.doc .kbl-s{display:none}
.kb-split.doc .kbl-row{padding:7px 8px}
.kb-mid{width:264px;flex:none;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:10px;display:flex;flex-direction:column;min-height:0}
.kb-mid-h{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.kbdc{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.kbdc:hover{background:var(--sunken)}
.kbdc.on{background:var(--brand-soft);box-shadow:inset 2.5px 0 0 var(--brand)}
.kbdc-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.kbdc .idx{font-size:10.5px;flex:none}
.kb-viewer{flex:1;min-width:0;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column}
.dv-page{flex:1;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:22px 26px;font-size:14px;line-height:1.9;box-shadow:inset 0 0 0 1px rgba(0,0,0,.01)}
.dv-h{font-size:15px;font-weight:800;margin:14px 0 6px}
.dv-h:first-child{margin-top:0}
.dv-tb{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
.dv-tb th,.dv-tb td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.dv-tb th{background:var(--sunken);font-weight:700}
.rag-test{border:1px solid var(--brand-soft2);background:var(--brand-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
.rag-test input{background:var(--paper)}
.mk-strip{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.mk-card{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:13px 16px}
.mk-card.ag{border-color:var(--brand-soft2);background:var(--brand-soft)}
.mk-card>div{flex:1;min-width:0}
.mk-card b{font-size:15.5px;display:block}
.mk-card span{font-size:13px;color:var(--ink3);display:block;margin-top:1px}
.mk-sec{display:flex;align-items:center;gap:7px;margin:18px 0 10px;font-size:15.5px}
.mk-sec .num{background:var(--sunken);border-radius:99px;padding:0 8px;font-size:12.5px;font-weight:700}
.mk-sec .mk-sd{font-size:12.5px;color:var(--ink3);margin-left:4px}
@media(max-width:900px){.mk-strip{grid-template-columns:1fr}}
@media(max-width:980px){.kb-split{flex-direction:column;height:auto}.kbl,.kb-mid{width:100%!important;max-height:280px}.kb-split.doc .kbl{width:100%}}
@media (max-width:980px){.cmp-grid{grid-template-columns:1fr}}
.quick-item .qi-x{display:none;width:18px;height:18px;border-radius:5px;align-items:center;justify-content:center;color:var(--ink3);flex:none;margin-left:auto}
.quick-item:hover .qi-x{display:inline-flex}
.quick-item:hover .qi-x:hover{background:var(--warn-soft);color:var(--warn)}
.quick-item:hover .qi-x~.qi-t{display:none}
.convo .cv-act{display:none;width:20px;height:20px;border-radius:6px;align-items:center;justify-content:center;color:var(--ink3);flex:none}
.convo:hover .cv-act{display:inline-flex}
.convo .cv-act:hover{background:var(--brand-soft);color:var(--brand-deep)}
.proj-h .cv-act{display:none;width:20px;height:20px;border-radius:6px;align-items:center;justify-content:center;color:var(--ink3);flex:none;margin-left:2px}
.proj-h:hover .cv-act{display:inline-flex}
.dd-item.danger .di-t{color:var(--danger)}
.dd-sep{border-top:1px solid var(--line);margin:4px 6px}
.apply-strip{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:7px 11px;margin-bottom:7px;box-shadow:var(--shadow)}
.apply-strip b{color:var(--ink)}
.agent-hero{text-align:center}
.apply-strip .as-x{margin-left:auto;color:var(--ink3);width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.apply-strip .as-x:hover{background:var(--sunken);color:var(--danger)}
.ag-ic{color:var(--brand);display:inline-flex;flex:none}
.sb-prof{font-weight:600;color:var(--ink)!important}
/* ---- 출처 표시: RFP 확정 vs 추가 제안 ---- */
/* 기능 ID 칩 · 고객 시연 시 로고 더블클릭 또는 Ctrl+Shift+I로 숨김 */
.fid{display:inline-flex;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.01em;color:var(--brand-deep);background:var(--brand-soft);border:1px solid var(--brand-soft2);border-radius:5px;padding:0 5px;margin:0 2px;vertical-align:1.5px;white-space:nowrap}
.fid-wrap{display:inline}
body.hide-ids .fid{display:none}
body.hide-ids .prop-badge{display:none}
body.hide-ids .scope-toggle{display:none}
.prop-badge{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;letter-spacing:.02em;color:var(--ink3);background:none;border:1px dashed var(--line2);border-radius:99px;padding:1px 6px;vertical-align:2px;cursor:help}

.scope-toggle{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;background:var(--paper)}
.scope-toggle .dot2{width:7px;height:7px;border-radius:50%;background:var(--m-res)}
body.hide-prop .scope-toggle{border-color:var(--brand);color:var(--brand-deep);background:var(--brand-soft)}
body.hide-prop .scope-toggle .dot2{background:var(--brand)}
.sb-foot button:hover{background:var(--sunken);color:var(--ink)}

.chat-title{font-weight:700;font-size:16.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;min-width:0}
.chat-title .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.retention{font-size:12.5px;color:var(--ink3);font-weight:500}
.chat-head .acts{margin-left:auto;display:flex;gap:4px;align-items:center}
.model-btn{display:flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--paper);font-weight:600;font-size:14px;transition:border-color .12s}

.agent-card .ah{display:flex;gap:10px;align-items:flex-start}
.agent-card h4{font-size:16.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.agent-card .by{font-size:13px;color:var(--ink3)}
.agent-card .ad{font-size:14px;color:var(--ink2);line-height:1.55;flex:1}
.agent-stats{display:flex;gap:12px;font-size:13px;color:var(--ink3);align-items:center}
.rate{color:var(--warn);font-weight:600}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lb-row:last-child{border:none}
.pct-tag{white-space:nowrap;flex:none}
.lb-rank{width:26px;font-weight:700;font-size:16px;color:var(--ink3);text-align:center}
.lb-rank.top{color:#fff;background:var(--warn);border-radius:7px;line-height:22px;height:22px}
.review{padding:12px 0;border-bottom:1px solid var(--line)}
.review:last-child{border:none}
.review .rh{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:4px}
.review .rh b{font-size:14px}
.review p{font-size:15px;color:var(--ink2)}
.qa-item{padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px}
.qa-item .q{font-weight:600;font-size:15px;display:flex;gap:7px;margin-bottom:6px}
.qa-item .a{font-size:14px;color:var(--ink2);display:flex;gap:7px}
.qa-item .adopted{font-size:11.5px}

/* 게시판 */
.brd-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brd-tabs button.brd-qna{margin-left:auto}
.brd-tabs button.brd-qna::before{content:'';position:absolute;left:-8px;top:10px;bottom:10px;width:1px;background:var(--line)}
.brd-tabs button{padding:9px 14px;font-weight:600;font-size:15px;color:var(--ink3);position:relative}
.brd-tabs button.on{color:var(--brand-deep)}
.brd-tabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2.5px;background:var(--brand);border-radius:2px}
.post-row{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.post-row:hover{background:var(--sunken)}
.post-row .pt{flex:1;min-width:0}
.post-row .pt b{font-size:15.5px;font-weight:600}
.post-row .pm{font-size:13px;color:var(--ink3);margin-top:2px;display:flex;gap:10px}
.comment{display:flex;gap:10px;padding:10px 0;font-size:15px}
.cmt-item{border-bottom:1px solid var(--line)}
.cmt-item:last-child{border:none}
.cmt-body{flex:1;min-width:0}
.cmt-top{display:flex;align-items:center;gap:6px}
.cmt-badge{font-size:10.5px;font-weight:700;padding:1.5px 6px;border-radius:99px;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand)}
.cmt-acts{display:flex;gap:10px;margin-top:5px}
.cmt-acts button{background:none;border:none;padding:0;font-size:12.5px;color:var(--ink3);cursor:pointer;display:flex;align-items:center;gap:3px}
.cmt-acts button:hover{color:var(--brand)}
.cmt-replies{margin-left:14px;padding-left:12px;border-left:2px solid var(--line);position:relative}
.reply-mark{color:var(--ink3);flex:none;margin-top:3px;transform:rotate(90deg)}
.post-view{padding:0;overflow:hidden}
.pv-body{padding:26px 30px;font-size:16.5px;line-height:1.95;white-space:pre-line;color:var(--ink)}
.pv-att{padding:14px 30px;border-top:1px solid var(--line);background:var(--sunken)}
.pv-att-h{font-size:13.5px;font-weight:700;color:var(--ink2);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.pv-cmts{padding:18px 30px 22px;border-top:1px solid var(--line)}
.pv-cmts-h{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:12px}
.cmt-write{display:flex;gap:8px;margin-bottom:8px}
.cmt-write input{flex:1}
.pv-cmts .cmt-item{padding:2px 0}
.cmt-replies .comment{padding:8px 0}
.cmt-replies .comment .cw{width:22px;height:22px;font-size:10px}
.reply-tag{font-size:11px;color:var(--ink3);display:inline-flex;align-items:center;gap:3px;margin-right:4px}
.reply-box{margin:4px 0 10px 26px;display:flex;gap:6px}
.reply-box input{flex:1;font-size:14px;padding:7px 10px}
.reply-box .btn{padding:6px 12px;font-size:13.5px}
.pfile{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-top:6px}
.pfile .pf-ic{flex:none;width:38px;height:38px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;font-family:"IBM Plex Mono",monospace}
.pfile .pf-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pfile .pf-m b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfile .pf-m span{font-size:11.5px;color:var(--ink3)}
.pager{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:18px}
.pager button{min-width:30px;height:30px;border-radius:8px;font-size:14px;color:var(--ink2);border:1px solid transparent}
.pager button:hover{background:var(--sunken)}
.pager button.on{background:var(--brand);color:#fff;font-weight:700}
.pager button:disabled,button[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.load-more{display:flex;justify-content:center;margin-top:18px}
.load-more button{padding:8px 22px;border:1px solid var(--line2);border-radius:99px;font-size:14px;font-weight:600;color:var(--ink2);background:var(--paper)}
.load-more button:hover{border-color:var(--brand);color:var(--brand)}
.comment .cw{width:26px;height:26px;border-radius:50%;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink2);flex:none}

/* 대시보드 */
.kpi{padding:15px 17px}
.kpi .kl{font-size:13.5px;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kv{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.kpi .kd{font-size:14px;margin-top:2px;font-weight:700}
.kd.up{color:var(--ok)} .kd.down{color:var(--danger)} .kd.flat{color:var(--ink3)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
.panel{padding:18px 20px}
.panel h3{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 .more{margin-left:auto;font-size:13px;color:var(--brand-deep);font-weight:600}
.bar-h{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:15px}
.bar-h .bl{width:158px;color:var(--ink);font-weight:600;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-h .bt{flex:1;height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.bar-h .bt i{display:block;height:100%;border-radius:4px;background:var(--brand)}
.bar-h .bv{width:86px;text-align:right;color:var(--ink);font-weight:700;font-size:14px;flex:none}
.gauge-wrap{display:flex;align-items:center;gap:16px}
.mini-list{display:flex;flex-direction:column}
.mini-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.mini-row:last-child{border:none}
.mini-row .mr-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row .mr-v{color:var(--ink);font-weight:700;font-size:14px}
.status-dot{width:8px;height:8px;border-radius:50%;flex:none}
.status-dot.ok{background:var(--ok)} .status-dot.warn{background:var(--warn)} .status-dot.err{background:var(--danger)}

/* 관리 */
.admin-layout{display:flex;flex:1;min-height:0}
.todo-card{display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.todo-card:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.todo-card .tc-n{font-size:26px;font-weight:800;color:var(--brand-deep);min-width:30px}
.todo-card b{font-size:15px}
.todo-card .tc-d{font-size:12.5px;color:var(--ink3);margin-top:2px}
.todo-card>svg:last-child{margin-left:auto;color:var(--ink3)}
.nav-badge{margin-left:auto;background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.todo-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:8px 13px;margin-bottom:16px}
.todo-strip button{display:inline-flex;gap:5px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600}
.todo-strip button:hover{border-color:var(--warn);color:var(--warn)}
.admin-nav{width:210px;flex:none;background:var(--paper);border-right:1px solid var(--line);padding:16px 10px;overflow-y:auto}
.admin-nav .an-sec{font-size:11.5px;font-weight:700;color:var(--ink3);padding:12px 10px 4px}
.admin-nav button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;font-size:15px;color:var(--ink2);text-align:left;font-weight:500}
.admin-nav button:hover{background:var(--sunken)}
.admin-nav button.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.rule-card{padding:13px 16px;display:flex;align-items:center;gap:13px}
.rule-card .rc-b{flex:1;min-width:0}
.rule-card .cond{font-size:15px;font-weight:600}
.rule-card .eff{font-size:13.5px;color:var(--ink2);margin-top:3px}
.matrix{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.matrix table{width:100%;border-collapse:collapse;font-size:14px}
.matrix th,.matrix td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:center}
.matrix th{background:var(--sunken);font-size:13px;color:var(--ink2)}
.matrix td:first-child,.matrix th:first-child{text-align:left;font-weight:600}
.matrix tr:last-child td{border:none}
.ok-mark{color:var(--ok);font-weight:700} .no-mark{color:var(--ink3)}
.cond-mark{color:var(--warn);font-weight:600;font-size:12.5px}
.sim-result{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--sunken);margin-top:12px}
.sim-result h5{font-size:13.5px;color:var(--ink3);margin:10px 0 5px}
.sim-result h5:first-child{margin-top:0}
.audit-row{display:grid;grid-template-columns:130px 90px 1fr 120px;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.audit-row:last-child{border:none}
.audit-row .at{color:var(--ink3);font-size:13px}
.tree{font-size:15px}
.tree-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px}
.tree-row:hover{background:var(--sunken)}
.tree-row .tv{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:13.5px;color:var(--ink2)}
.tree-row.lv1{padding-left:30px} .tree-row.lv2{padding-left:50px}
.conn-box{display:flex;align-items:center;gap:14px;padding:15px 17px}
.conn-box .ci{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.keyrow{font-family:"IBM Plex Mono",monospace;font-size:13.5px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:4px 9px}

/* 알림 팝오버 */
.pop{position:fixed;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-lg);z-index:120;width:330px;animation:min .14s ease;overflow:hidden}
.pop-h{padding:12px 15px;border-bottom:1px solid var(--line);font-weight:700;font-size:15.5px;display:flex;align-items:center}
.pop-b{max-height:380px;overflow-y:auto}
.noti{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.noti:hover{background:var(--sunken)}
.noti:last-child{border:none}
.noti .ni{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.noti .nb{flex:1;font-size:14px;line-height:1.5;color:var(--ink2)}
.noti .nb b{color:var(--ink);font-size:15px}
.noti-all{width:100%;text-align:center;padding:9px;font-size:13.5px;font-weight:700;color:var(--brand-deep);border-top:1px solid var(--line)}
.noti-all:hover{background:var(--brand-soft)}
.noti .nt{font-size:12.5px;color:var(--ink3)}

/* 반응형 */
@media(max-width:1080px){ nav.tabs button span.tl{display:none} nav.tabs button{padding:0 10px} }
@media(max-width:860px){
  .sidebar{position:absolute;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg);width:264px}
  .sidebar.min{width:264px;border-right:1px solid var(--line)}
  .sidebar.min>*{opacity:1;pointer-events:auto}
  .sb-fold{display:none}
  .sidebar.open{transform:none}
  .login-side{display:none}
  .mode-pick{grid-template-columns:1fr}
  .grid2,.grid3,.sc-grid,.compare-grid{grid-template-columns:1fr}
  .artifact.on{position:absolute;right:0;top:0;bottom:0;width:100%;z-index:45}
  .audit-row{grid-template-columns:1fr;gap:2px}
  .page-inner{padding:18px 14px 60px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

/* 한국어 조사 자동 선택 · 마지막 글자 받침 유무로 을/를, 이/가, 은/는, 와/과 */
function josa(word,pair){
  const w=String(word||'').replace(/<[^>]+>/g,'').trim(); const ch=w[w.length-1]||'';
  const code=ch.charCodeAt(0); let batchim;
  if(code>=0xAC00&&code<=0xD7A3) batchim=(code-0xAC00)%28!==0;
  else if(/[0-9]/.test(ch)) batchim=/[0136789]/.test(ch); /* 0,1,3,6,7,8,9 받침 */
  else if(/[A-Za-z]/.test(ch)) batchim=/[lmnrLMNR]/.test(ch);
  else batchim=false;
  const P={'을':['을','를'],'이':['이','가'],'은':['은','는'],'과':['과','와'],'으로':['으로','로']}[pair]||['을','를'];
  if(pair==='으로'&&code>=0xAC00&&code<=0xD7A3&&(code-0xAC00)%28===8) return '로'; /* ㄹ 받침은 '로' */
  return batchim?P[0]:P[1];
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function tip(t){ return '<span class="tipq" data-tip="'+esc(t)+'" tabindex="0" onclick="event.stopPropagation()">?</span>'; }
let _tipEl=null;
function _tipShow(t){
  _tipHide();
  const r=t.getBoundingClientRect(); const d=document.createElement('div');
  d.className='tip-pop'; d.textContent=t.dataset.tip; document.body.appendChild(d); _tipEl=d;
  const w=d.offsetWidth, h=d.offsetHeight;
  let x=r.left+r.width/2-w/2; x=Math.max(8, Math.min(x, innerWidth-w-8));
  let y=r.bottom+8; if(y+h>innerHeight-8) y=r.top-h-8;
  d.style.left=x+'px'; d.style.top=y+'px';
}
function _tipHide(){ if(_tipEl){ _tipEl.remove(); _tipEl=null; } }
document.addEventListener('mouseover', e=>{ const t=e.target.closest&&e.target.closest('.tipq'); if(t&&t.dataset.tip) _tipShow(t); });
document.addEventListener('mouseout', e=>{ if(e.target.closest&&e.target.closest('.tipq')) _tipHide(); });
document.addEventListener('focusin', e=>{ const t=e.target.closest&&e.target.closest('.tipq'); if(t&&t.dataset.tip) _tipShow(t); });
document.addEventListener('focusout', e=>{ if(e.target.closest&&e.target.closest('.tipq')) _tipHide(); });
window.addEventListener('scroll', _tipHide, true);

const C7_ANS='<p>네 지표(증상·삶의 질·객관 지표·환자 체감)는 서로 다른 것을 재기 때문에, 하나만 좋아져도 효과 있음으로 보거나 모두 좋아져야만 효과 있음으로 보면 판단이 흔들립니다. 그래서 <b>어떤 지표를 중심에 둘지, 몇 개를 충족해야 반응으로 볼지, 언제 판정할지</b>를 치료 시작 전에 정해 두는 것이 핵심입니다.</p><h4>1. 지표별 개선 기준</h4><table class="ref-tbl"><thead><tr><th>영역</th><th>측정</th><th>개선 기준</th></tr></thead><tbody><tr><td>증상</td><td>IPSS 총점(0~35)</td><td>기저 대비 3점 이상 또는 25% 이상 감소</td></tr><tr><td>삶의 질</td><td>IPSS QoL 문항(0~6)</td><td>1점 이상 개선</td></tr><tr><td>객관 지표</td><td>Qmax, PVR</td><td>Qmax 3 mL/s 이상 증가, PVR 100 mL 미만 또는 증가 없음</td></tr><tr><td>환자 체감</td><td>PGI-I(1~7)</td><td>1~2점(매우·많이 좋아짐)</td></tr></tbody></table><p>측정할 때는 Qmax를 <b>배뇨량 150 mL 이상</b>에서 판정하고, PVR은 변동이 커서 기준에 걸리면 한 번 더 확인합니다. IPSS는 총점과 함께 배뇨·저장 증상 소점수를 따로 남겨 두면 부분 반응일 때 다음 약을 고르는 근거가 됩니다.<cite class="cite" data-c="bph" data-h="4,5,6,7" data-l="4장 4.1–4.4"></cite></p><h4>2. 복합 반응을 정하는 방식</h4><ul><li><b>모두 충족</b>: 엄격하지만 반응률이 낮게 나와 진료 판단에는 잘 맞지 않습니다.</li><li><b>핵심 지표 + 나머지 중 일부 (추천)</b>: 증상을 반드시 포함해 4개 영역 중 3개 이상이면 반응군, 증상만 충족하면 부분 반응, 증상이 미충족이면 비반응입니다.</li><li><b>점수화</b>: 영역별 점수를 합산합니다. 연구용으로는 정교하지만 가중치 근거를 따로 정해야 합니다.</li></ul><p>원내 프로토콜은 두 번째 방식을 따릅니다.<cite class="cite" data-c="bph" data-h="8" data-l="4장 4.5"></cite></p><h4>3. 평가 시점</h4><ul><li><b>치료 전</b>: IPSS·QoL, Qmax, PVR, 전립선 크기, PSA</li><li><b>4~6주</b>: 알파차단제 첫 반응과 부작용</li><li><b>12주</b>: 복합 반응 1차 판정</li><li><b>6개월</b>: 5-알파환원효소억제제를 쓴 경우 최종 판정</li></ul><p>5-알파환원효소억제제는 효과가 수개월에 걸쳐 나타나므로 판정 시점을 따로 둡니다.<cite class="cite" data-c="bph" data-h="0,1,2" data-l="3장 3.1–3.3"></cite><cite class="cite" data-c="auaB" data-h="1" data-l="평가와 추적"></cite></p><h4>4. 판정 결과에 따른 치료계획</h4><ul><li><b>반응군</b>: 현재 치료를 유지하고 6개월~1년 간격으로 같은 지표를 추적합니다.</li><li><b>부분 반응</b>: 전립선 30 mL 이상 또는 PSA 1.5 ng/mL 이상이면 5-알파환원효소억제제 병용을 고려합니다. 빈뇨·절박뇨 같은 저장 증상이 남으면 PVR을 확인한 뒤 항무스카린제나 베타3 작용제 추가를 고려하고, 발기부전이 함께 있으면 PDE5 억제제도 선택지입니다.</li><li><b>비반응 또는 PVR 증가</b>: 약을 더 늘리기보다 수술적 치료(TURP, HoLEP 등) 상담으로 넘어갑니다. 요폐, 반복 요로감염, 방광결석, 신기능 저하가 있으면 판정 시점과 관계없이 수술을 상의합니다.<cite class="cite" data-c="bph" data-h="2,3" data-l="3장 3.3–3.4"></cite><cite class="cite" data-c="eauB" data-h="2" data-l="치료 반응과 수술 고려"></cite></li></ul><h4>5. 해석할 때 주의할 점</h4><ul><li>5-알파환원효소억제제를 6개월 이상 복용하면 PSA가 약 절반으로 떨어지므로, 전립선암 선별 목적으로는 측정값을 두 배로 보정해 해석합니다.</li><li>약 부작용(사정장애, 기립성 저혈압 등)으로 환자 체감 점수가 낮게 나올 수 있으니, PGI-I가 낮으면 부작용 여부를 먼저 확인합니다.</li><li>연구로 진행한다면 반응 정의와 판정 시점을 사전에 등록하고, 중도 탈락자 처리 방법도 미리 정해 두세요.</li></ul><h4>6. 기록 방법</h4><p>방문마다 네 영역을 같은 표로 남기면 판정이 쉬워집니다. 이 표를 프롬프트셋으로 저장해 두면 외래 기록을 붙여넣기만 해도 판정까지 정리됩니다.</p><p style="font-size:13px;color:var(--ink3)">기준값은 원내 프로토콜 기준입니다 · 의료진 확인 필요</p>';
const C7_ALT='<p>같은 근거로, 진료 순서에 따라 바로 쓸 수 있는 <b>체크리스트</b>로 다시 정리했습니다.</p><table class="ref-tbl"><thead><tr><th>시점</th><th>할 일</th><th>판정 · 다음 단계</th></tr></thead><tbody><tr><td>치료 전</td><td>IPSS(배뇨·저장 소점수 포함), QoL, Qmax(배뇨량 150 mL 이상), PVR, 전립선 크기, PSA 기록</td><td>반응 기준을 이 시점 값으로 고정</td></tr><tr><td>4~6주</td><td>알파차단제 반응·부작용 확인</td><td>부작용으로 복약 중단 시 약제 변경</td></tr><tr><td>12주</td><td>네 영역 재측정</td><td>증상 포함 3개 이상 = 반응군 · 증상만 = 부분 반응 · 증상 미달 = 비반응</td></tr><tr><td>부분 반응</td><td>전립선 크기·PSA, 저장 증상, PVR 확인</td><td>5-ARI 병용 또는 PVR 확인 후 항무스카린제·베타3 작용제 추가</td></tr><tr><td>6개월</td><td>5-ARI 병용 시 최종 판정 · PSA는 두 배 보정</td><td>비반응·PVR 증가 시 TURP·HoLEP 상담</td></tr></tbody></table><p><b>바로 수술을 상의할 때</b>: 요폐, 반복 요로감염, 방광결석, 신기능 저하<cite class="cite" data-c="eauB" data-h="2" data-l="치료 반응과 수술 고려"></cite></p><p><b>판정 기준</b>: IPSS 3점 또는 25% 이상 감소 · QoL 1점 이상 · Qmax 3 mL/s 이상 증가와 PVR 100 mL 미만 · PGI-I 1~2점<cite class="cite" data-c="bph" data-h="4,5,6,7,8" data-l="4장 4.1–4.5"></cite><cite class="cite" data-c="bph" data-h="0,1,2,3" data-l="3장 3.1–3.4"></cite></p><p style="font-size:13px;color:var(--ink3)">기준값은 원내 프로토콜 기준입니다 · 의료진 확인 필요</p>';

function openModal(html, cls){

function applyLimits(root){
  root.querySelectorAll('input:not([type]),input[type="text"]').forEach(i=>{ if(!i.maxLength||i.maxLength<0||i.maxLength>1e5){ i.maxLength=(i.classList.contains('num')||/url|Url/.test(i.id))?200:60; } });

    if(!t.maxLength||t.maxLength<0||t.maxLength>1e5) t.maxLength=/Body|Custom|Prompt/.test(t.id||'')?4000:2000;

/* ================= 공통: 삭제 되돌리기 · 지연 실행 =================

const UNDO_MS=5000;
function undoToast(msg, onUndo, onCommit, icon){
  const t=document.createElement('div'); t.className='toast undo';
  t.innerHTML=ic(icon||'trash',15)+'<span>'+esc(msg)+'</span><button class="undo-btn">되돌리기 <b class="num">'+Math.round(UNDO_MS/1000)+'</b></button>';
  $('#toasts').appendChild(t);
  let left=Math.round(UNDO_MS/1000); const cnt=t.querySelector('.undo-btn b');
  const tick=setInterval(()=>{ left--; if(cnt) cnt.textContent=left; },1000);
  const done=(undo)=>{ clearInterval(tick); clearTimeout(tm); t.classList.add('out'); setTimeout(()=>t.remove(),260); if(undo){ onUndo&&onUndo(); toast('되돌렸어요','check'); } else { onCommit&&onCommit(); } };
  const tm=setTimeout(()=>done(false),UNDO_MS);
  t.querySelector('.undo-btn').onclick=()=>done(true);
  return t;
}

/* ================= 자동 잠금 (비활성 · 병원 보안 정책) =================
   무반응 시간이 지나면 화면을 완전히 가리고 재인증 후 그 자리로 돌아온다. 값은 정책(가드레일)에서 관리 · 예시값 */
const LOCK={ idleMin:30, warnMin:5, clinIdleMin:15, sharedIdleMin:10, sessionHours:12, demo:false };
let _lastAct=Date.now(), _lockT=null, _locked=false, _lockWarnEl=null, _busyUntil=0;
function lockIdleMs(){ const m= LOCK.demo?2 : (state.mode==='clin'?LOCK.clinIdleMin:LOCK.idleMin); return m*60*1000; }
function lockWarnMs(){ return LOCK.demo?30*1000 : LOCK.warnMin*60*1000; }
function touchActivity(){ if(_locked) return; _lastAct=Date.now(); if(_lockWarnEl){ _lockWarnEl.remove(); _lockWarnEl=null; } }
function markBusy(ms){ _busyUntil=Math.max(_busyUntil, Date.now()+(ms||30*60*1000)); }   /* 스트리밍·업로드·근거 정리 진행 중 = 활동 */
function lockTick(){
  if(_locked||!document.body.classList.contains('inapp')) return;
  const idle=Date.now()-Math.max(_lastAct,_busyUntil);
  const left=lockIdleMs()-idle;
  if(left<=0){ lockScreen('자동'); return; }
  if(left<=lockWarnMs()){
    if(!_lockWarnEl){ _lockWarnEl=document.createElement('div'); _lockWarnEl.id='lockWarn'; document.body.appendChild(_lockWarnEl); }
    const s=Math.ceil(left/1000); _lockWarnEl.innerHTML=ic('lock',13)+'<span><b class="num">'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</b> 후 자동 잠금 · 사용이 없어서예요</span><button class="btn pri sm" onclick="touchActivity();toast(\'계속 사용해요\',\'check\')">계속 사용</button><button class="btn sec sm" onclick="lockScreen(\'직접\')">지금 잠그기</button>';
  } else if(_lockWarnEl){ _lockWarnEl.remove(); _lockWarnEl=null; }
}
function lockScreen(how){
  if(_locked) return; _locked=true; if(_lockWarnEl){ _lockWarnEl.remove(); _lockWarnEl=null; }
  closePops(); const d=document.getElementById('notiDrawer'); if(d) d.remove();
  const el=document.createElement('div'); el.id='lockScreen';
  const m=Math.round(lockIdleMs()/60000);
  el.innerHTML='<div class="lock-card"><div class="lock-ic">'+ic('lock',26)+'</div><h2>화면을 잠갔어요</h2><p>'+(how==='자동'?(LOCK.demo?'2분':m+'분')+' 동안 사용이 없어 병원 보안 정책에 따라 잠갔어요.':'직접 잠갔어요.')+'<br>작업 중이던 내용은 그대로 남아 있어요.</p>'+
   '<div class="lock-who">'+ic('user',13)+' '+esc(USER.name)+' · '+esc(USER.dept)+' '+esc(USER.job)+'</div>'+
   '<button class="btn pri" style="width:100%;margin-top:14px" onclick="unlockScreen()">'+ic('key',14)+'Knox 재인증으로 풀기</button>'+
   '<div class="lock-alt"><a onclick="unlockScreen(true)">다른 계정으로 로그인</a> · <span>재인증 5회 실패 시 로그아웃 (확인 필요)</span></div></div>';
  document.body.appendChild(el);
  AUDLOG.unshift({t:nowHM(), kind:'세션', who:USER.name, dept:USER.dept, what:'화면 잠금 · '+(how==='자동'?'무반응 '+(LOCK.demo?'2분':m+'분'):'직접 잠금'), res:'', mode:state.mode});
}
function unlockScreen(other){
  const el=document.getElementById('lockScreen'); if(!el) return;
  if(other){ location.hash=''; location.reload(); return; }
  el.querySelector('.btn.pri').innerHTML='<span class="live-dot"></span> Knox 인증 중…';
  setTimeout(()=>{ el.remove(); _locked=false; touchActivity(); AUDLOG.unshift({t:nowHM(), kind:'세션', who:USER.name, dept:USER.dept, what:'잠금 해제 · Knox 재인증', res:'', mode:state.mode}); toast('잠금 해제 · 하던 작업 그대로예요','check'); },700);
}
function nowHM(){ const n=new Date(); return String(n.getMonth()+1).padStart(2,'0')+'.'+String(n.getDate()).padStart(2,'0')+' '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
['mousemove','keydown','click','scroll','touchstart','input'].forEach(ev=>document.addEventListener(ev,()=>{ if(!_locked) touchActivity(); },{passive:true,capture:true}));
setInterval(lockTick,1000);

function scopeOK(kind,obj){
  if(persona==='ops') return true;
  if(persona==='dept'){
    if(kind==='promo'||kind==='mcp') return false;
    if(kind==='dep') return obj.dept===USER.dept;
    if(kind==='kb') return obj.layer==='부서';
    if(kind==='doc') return obj.kb.layer==='부서';
    if(kind==='fb') return obj.dept===USER.dept;
    if(kind==='rep'||kind==='cmu') return false;
    if(kind==='tok') return (obj.dept||'').includes(USER.dept)||(obj.by||'').includes(USER.dept);
    return false;
  }
  return false;
}

let scrMode=false, scrObs=null;
/* 팝업 제목으로 찾기 · exact 제목 일치(부분 일치 옵션) */
function scrModal(title, partial){
  return [...document.querySelectorAll('.modal-wrap:not(.closing) .modal')].find(m=>{ const h=m.querySelector('.modal-h h3'); if(!h) return false; const t=h.textContent.trim(); return partial? t.startsWith(title) : t===title; });
}
function paintScr(){
  if(scrObs) scrObs.disconnect();
  document.querySelectorAll('.scr-tag').forEach(x=>x.remove());
  if(!scrMode){ document.querySelectorAll('.scr-host').forEach(x=>x.classList.remove('scr-host')); return; }
  const seen=new Set();
  SCRDEF.forEach(([id,name,sel])=>{
    let els=[];
    try{ if(typeof sel==='string') els=[...document.querySelectorAll(sel)]; else { const r=sel(scrModal); if(r) els=Array.isArray(r)?r:[r]; } }catch(_){ }
    els.filter(Boolean).forEach(el=>{
      if(!el.isConnected || seen.has(el)) return; seen.add(el);
      const v=el.closest('.view'); if(v&&!v.classList.contains('on')) return;
      const cs=getComputedStyle(el); if(cs.display==='none'||cs.visibility==='hidden') return;
      if(cs.position==='static') el.classList.add('scr-host');
      const t=document.createElement('span'); t.className='scr-tag'; t.innerHTML='<b>'+id+'</b>'+name; t.title=name; el.appendChild(t);
    });
  });
  let bar=document.getElementById('scrBar');
  if(!bar){ bar=document.createElement('div'); bar.id='scrBar'; document.body.appendChild(bar); }
  if(!bar.dataset.ready){ bar.dataset.ready='1'; bar.innerHTML=ic('list',12)+'<b>화면 ID 표시 중</b> · 기능정의서 “프로토타입 화면 목록” 기준 · Ctrl+Shift+X 로 끄기 <button class="btn sec sm" onclick="openScrList()">전체 목록 · 검색</button><button class="icon-btn" onclick="toggleScr()">'+ic('x',13)+'</button>'; }
  if(scrObs) scrObs.observe(document.body,{childList:true,subtree:true});
}

document.addEventListener('fullscreenchange',()=>{ const b=document.getElementById('fsBtn'); if(!b) return; const on=!!document.fullscreenElement; b.classList.toggle('on',on); b.title=on?'전체 화면 해제 (Esc)':'전체 화면 (F11 · Esc로 복귀)'; b.innerHTML=on?'<svg class="ic" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>':'<svg class="ic" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>'; });
function toggleScr(){
  scrMode=!scrMode;
  if(scrMode){ scrObs=new MutationObserver(muts=>{ if(muts.every(m=>[...m.addedNodes,...m.removedNodes].every(n=>n.nodeType!==1||n.classList.contains('scr-tag')||n.id==='scrBar'))) return; clearTimeout(window._scrT); window._scrT=setTimeout(paintScr,120); }); paintScr(); toast('화면 ID 표시 켬 · 끄기는 Ctrl+Shift+X','list'); }
  else { if(scrObs) scrObs.disconnect(); scrObs=null; document.querySelectorAll('.scr-tag').forEach(x=>x.remove()); document.querySelectorAll('.scr-host').forEach(x=>x.classList.remove('scr-host')); const b=document.getElementById('scrBar'); if(b) b.remove(); }
}

/* ---- 기능 ID 자동 칩: 화면 텍스트의 (XXX-nn) 패턴을 명세서 ID 칩으로 표시 ---- */
const FID_RX=/\(([A-Z]{2,4}-\d{2}(?:[^()]{0,26})?)\)/g;
function wrapFids(root){
  const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>{
    if(!n.nodeValue || n.nodeValue.indexOf('(')<0) return NodeFilter.FILTER_REJECT;
    const p=n.parentNode; if(!p) return NodeFilter.FILTER_REJECT;
    const tag=p.nodeName;
    if(tag==='SCRIPT'||tag==='STYLE'||tag==='TEXTAREA'||tag==='INPUT'||p.closest('.fid')||p.closest('.fid-wrap')) return NodeFilter.FILTER_REJECT;
    return FID_RX.test(n.nodeValue)? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
  }});
  const nodes=[]; while(tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(n=>{
    /* flex/gap 컨테이너가 조각난 텍스트를 개별 아이템으로 취급하지 않도록, 통째로 span 하나에 담는다 */
    const holder=document.createElement('span'); holder.className='fid-wrap';
    let last=0; const v=n.nodeValue; let m; FID_RX.lastIndex=0;
    while((m=FID_RX.exec(v))){
      holder.appendChild(document.createTextNode(v.slice(last,m.index)));
      const c=document.createElement('i'); c.className='fid'; c.title='기능명세서(누락검토반영) ID'; c.textContent=m[1];
      holder.appendChild(c); last=m.index+m[0].length;
    }
    holder.appendChild(document.createTextNode(v.slice(last)));
    n.parentNode.replaceChild(holder,n);
  });
}
const fidObs=new MutationObserver(()=>{ fidObs.disconnect(); wrapFids(document.body); fidObs.observe(document.documentElement,{childList:true,subtree:true}); });
fidObs.observe(document.documentElement,{childList:true,subtree:true});

function setConvoProject(pid){
  const c=curConvo();
  if(!c){ state.pendingProject=pid; renderChat(); toast(pid?('“'+PROJECTS.find(p=>p.id===pid).name+'” 프로젝트 안에서 대화를 시작해요'):'프로젝트 없이 시작해요','folder'); return; }
  const old=c.project; c.project=pid; renderChatSidebar(); renderChat();
  if(old!==pid) undoToast(pid?'“'+PROJECTS.find(p=>p.id===pid).name+'” 프로젝트로 이동':'프로젝트에서 뺌',()=>{ c.project=old; renderChatSidebar(); renderChat(); },()=>{},'folder');
}
function moveConvo(id){
  const c=CONVOS.find(x=>x.id===id); if(!c) return;
  const w=openModal(mh('프로젝트로 이동','folder','<b>'+esc(c.title)+'</b> 대화를 옮길 프로젝트를 고르세요')+'<div class="modal-b"><div class="radio-cards" id="mvP" style="grid-template-columns:1fr;gap:6px">'+
   PROJECTS.map(p=>'<button data-p="'+p.id+'" class="'+(c.project===p.id?'on':'')+'"><b>'+ic('folder',12)+' '+esc(p.name)+'</b><span style="font-size:12.5px;color:var(--ink3)">대화 '+CONVOS.filter(x=>x.project===p.id).length+'개</span></button>').join('')+
   '<button data-p="" class="'+(!c.project?'on':'')+'"><b>'+ic('chat',12)+' 프로젝트 없음 (최근 대화로)</b></button></div></div>'+
   '<div class="modal-f"><button class="btn sec" onclick="closeModal(this)">취소</button><button class="btn pri" id="mvOk">이동</button></div>');
  w.querySelectorAll('#mvP button').forEach(b=>b.onclick=()=>{ w.querySelectorAll('#mvP button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
