function delConvo(id){
  const c=CONVOS.find(x=>x.id===id); if(!c) return;
  const w=openModal(mh('대화 삭제','trash')+'<div class="modal-b"><p style="font-size:15px;line-height:1.7;margin:0"><b>'+esc(c.title)+'</b> 대화를 삭제할까요?<br>'+(SHARES.some(s=>s.title===c.title&&!s.revoked)?'살아 있는 공유 링크는 함께 회수돼요 · ':'')+'감사 기록은 보존되고, 5초 안에 되돌릴 수 있어요.</p></div>'+
   '<div class="modal-f"><button class="btn sec" onclick="closeModal(this)">취소</button><button class="btn pri" id="dlOk" style="background:var(--danger)">삭제</button></div>');
  w.querySelector('#dlOk').onclick=()=>{ const i=CONVOS.findIndex(x=>x.id===id); if(i>-1) CONVOS.splice(i,1); const wasCur=state.convoId===id; if(wasCur){ state.convoId=null; } closeWrap(w,true); renderChatSidebar(); renderChat();
    const links=SHARES.filter(s=>s.title===c.title&&!s.revoked);
    undoToast('대화를 삭제했어요'+(links.length?' · 공유 링크 '+links.length+'개 회수':''), ()=>{ CONVOS.splice(i,0,c); if(wasCur) state.convoId=id; renderChatSidebar(); renderChat(); }, ()=>{ links.forEach(s=>{ s.revoked=true; s.revokedWhy='대화 삭제'; }); logHandle&&logHandle('대화 삭제 · '+c.title+(links.length?' · 공유 링크 회수 '+links.length:'')); }); };

  const q = sbQv;
  const list = CONVOS.filter(c=>(!P1||!c.msgs.some(m=>m.artifact||m.tools||m.mcp))).filter(c=>!q || c.title.includes(q));
  const pinned = list.filter(c=>c.pinned), rest = list.filter(c=>!c.pinned && !c.project && !c.folder);
  const folders = [...new Set(list.filter(c=>c.folder).map(c=>c.folder))];
  const convoHtml = c => {
    const m = MODES[c.mode];
    return '<div class="convo '+(state.convoId===c.id?'on':'')+'" onclick="openConvo(\''+c.id+'\')">'+
      (c.pinned?'<span class="pin-ic">'+ic('pin',12)+'</span>':'<span class="mdot" style="background:'+m.color+'"></span>')+
      (S3&&c.agent?'<span class="ag-ic" title="에이전트 대화">'+ic('zap',10)+'</span>':'')+
      '<span class="t">'+esc(c.title)+'</span>'+

  };
  const sec=(k,iconN,label,extra)=>'<div class="sb-sec sbf'+(sbClosed.has('s:'+k)?' closed':'')+'" onclick="togProj(\'s:'+k+'\')">'+ic(sbClosed.has('s:'+k)?'chevR':'chev',11)+ic(iconN,11)+label+(extra||'')+'</div>';
  const cl=k=>sbClosed.has('s:'+k);
  const myAg=S3?PROMPTSETS.filter(p=>isMineBy(p.owner)&&(S3&&(p.agent||isAgentLike(p)))):[];
  return (pinned.length?sec('pin','pin','고정됨')+(cl('pin')?'':pinned.map(convoHtml).join('')):'')+
    sec('ag',S3?'zap':'prompt',S3?'에이전트·프롬프트셋':'프롬프트셋',' <button class="add" onclick="event.stopPropagation();openApplyPick()" title="내 것·최근 사용·공개된 것에서 골라 쓰기">'+ic('plus',12)+'</button>')+
    (cl('ag')?'':'<div class="quick-list">'+
      myAg.map(a=>'<button class="quick-item" onclick="applyAgent(\''+a.id+'\')" title="이 에이전트와 새 대화 시작"><span class="qi-ic ag">'+ic('zap',11)+'</span>'+esc(a.name)+'</button>').join('')+
      ((P1||!S3)?[]:AGENTS.filter(a=>isMine(a,'agent')||a.installed||a.recent)).map(a=>'<button class="quick-item'+(a.hidden?' off':'')+'" onclick="applyAgent(\''+a.id+'\')" title="'+(a.hidden?'지금은 쓸 수 없는 에이전트예요':'이 에이전트와 새 대화 시작 · 최근 사용')+'"><span class="qi-ic ag">'+ic('zap',11)+'</span>'+esc(a.name)+'<span class="qi-x" onclick="event.stopPropagation();removeRecent(\'agent\',\''+a.id+'\')" title="목록에서 빼기 · 프롬프트 마켓에서 언제든 다시 쓸 수 있어요">'+ic('x',10)+'</span></button>').join('')+
      PROMPTSETS.filter(p=>(p.fav||p.recent)&&!(S3&&(p.agent||isAgentLike(p)))).map(p=>'<button class="quick-item" onclick="quickPS(\''+p.id+'\')" title="지금 대화에 적용 · 다음 메시지부터 덧붙여져요"><span class="qi-ic ps">'+ic('prompt',11)+'</span>'+esc(p.name)+'<span class="qi-x" onclick="event.stopPropagation();removeRecent(\'ps\',\''+p.id+'\')" title="목록에서 빼기">'+ic('x',10)+'</span></button>').join('')+
    '</div>')+
    sec('proj','folder','프로젝트',' <button class="add" onclick="event.stopPropagation();newProject()" title="새 프로젝트">'+ic('plus',12)+'</button>')+
    (cl('proj')?'':PROJECTS.map(p=>{
      const kids = list.filter(c=>c.project===p.id); const closed=sbClosed.has('p:'+p.id);
      return '<div class="proj"><div class="proj-h" onclick="togProj(\'p:'+p.id+'\')">'+ic(closed?'chevR':'chev',12)+ic('folder',14)+esc(p.name)+'<span class="cnt num">'+kids.length+'</span><button class="add cv-act" data-dd onclick="event.stopPropagation();openProjMenu(event,\''+p.id+'\')" title="프로젝트 옵션">'+ic('dots',13)+'</button></div>'+(closed?'':'<div class="proj-kids">'+kids.map(convoHtml).join('')+'</div>')+'</div>';

/* 에이전트·프롬프트셋 골라 쓰기 · 설치 없이 바로 적용 (에이전트=새 대화, 프롬프트셋=이 대화) */
let apTab='recent', apQ='';
function openApplyPick(){
  const w=openModal(mh((P1||!S3)?'프롬프트셋 골라 쓰기':'에이전트 · 프롬프트셋 골라 쓰기',(P1||!S3)?'prompt':'zap',(P1||!S3)?'고른 프롬프트셋은 지금 대화의 다음 메시지부터 적용돼요':'에이전트는 새 대화로 시작하고, 프롬프트셋은 지금 대화에 적용해요')+
   '<div class="modal-b"><div class="seg ap-tabs" id="apSeg">'+[['recent','최근 사용'],['mine','내가 만든 것'],['pub','공개된 것']].map(t=>'<button data-t="'+t[0]+'" class="'+(apTab===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>'+
   '<div class="sb-search pg-search" style="margin-bottom:10px;width:100%">'+ic('search',14)+'<input id="apQ" placeholder="이름으로 찾기" value="'+esc(apQ)+'"></div>'+
   '<div class="ap-list" id="apList"></div></div><div class="modal-f"><button class="btn sec" onclick="closeModal(this);openView(\'mkt\')">'+ic('store',12)+'프롬프트 마켓에서 둘러보기</button><button class="btn pri" onclick="closeModal(this)">닫기</button></div>','wide');
  const agOf=a=>({k:'agent', id:a.id, name:a.name, sub:(dispName(a.by||a.owner||''))+(a.kb?' · '+a.kb:''), off:!!(a.hidden&&!isMine(a,'agent')), t:a.recent||(a.installed?1:0)});
  const psOf=p=>({k:'ps', id:p.id, name:p.name, sub:dispName(p.owner)+' · '+p.scope+(p.scope==='비공개'?'':' 공개'), off:false, t:p.recent||(p.fav?1:0)});
  const isAgPS=p=>S3&&(p.agent||isAgentLike(p));
  const draw=()=>{
    const q=apQ.trim().toLowerCase(); let L=[];
    if(apTab==='mine') L=[...((P1||!S3)?[]:PROMPTSETS.filter(p=>isMineBy(p.owner)&&isAgPS(p)).map(p=>Object.assign(psOf(p),{k:'agent'}))),...((P1||!S3)?[]:AGENTS.filter(a=>isMine(a,'agent')).map(agOf)),...PROMPTSETS.filter(p=>isMineBy(p.owner)&&!isAgPS(p)).map(psOf)];
    if(apTab==='recent') L=[...((P1||!S3)?[]:AGENTS.filter(a=>a.recent||a.installed).map(agOf)),...PROMPTSETS.filter(p=>(p.recent||p.fav)&&!isAgPS(p)).map(psOf)].sort((a,b)=>(b.t||0)-(a.t||0));
    if(apTab==='pub') L=[...((P1||!S3)?[]:AGENTS.filter(a=>!a.hidden&&!agLocked(a)).map(agOf)),...mktPSList().map(psOf)];

/* ---- PII 탐지 (GRD-11 로컬 시뮬) ---- */
const PII_RX=[
  {rx:/\d{6}[-\s]?[1-4]\d{6}/g, name:'주민등록번호'},
  {rx:/01[016789][-\s]?\d{3,4}[-\s]?\d{4}/g, name:'휴대전화번호'},
  {rx:/(?:등록번호|병록번호)\s*[:#]?\s*\d{7,8}/g, name:'환자등록번호'}
];
function detectPII(t){ const f=[]; PII_RX.forEach(p=>{ const m=t.match(p.rx); if(m) f.push({name:p.name,n:m.length}); }); return f; }
function maskPII(t){ let r=t; PII_RX.forEach(p=>{ r=r.replace(p.rx,s=>s.replace(/\d/g,'●')); }); return r; }
/* 개인정보 탐지 팝업 · 현재 모드의 가드레일 정책(경고 / 차단+마스킹 / 차단)을 따른다 */
function piiPolicy(){ try{ const row=POLICY.rows.find(r=>r.k==='pii'); const md=P1?'gen':state.mode; return (row&&row.v[md])||'경고'; }catch(_){ return '경고'; } }
function piiMarkHtml(t){
  const R=[]; PII_RX.forEach(p=>{ const rx=new RegExp(p.rx.source, p.rx.flags.includes('g')?p.rx.flags:p.rx.flags+'g'); let m; while((m=rx.exec(t))){ if(!m[0]) { rx.lastIndex++; continue; } R.push([m.index, m.index+m[0].length]); } });
  R.sort((a,b)=>a[0]-b[0]); const M=[]; R.forEach(r=>{ const l=M[M.length-1]; if(l&&r[0]<=l[1]) l[1]=Math.max(l[1],r[1]); else M.push(r.slice()); });
  const cut=(x,first,last)=>{ if(x.length<=90) return esc(x); return (first?'':esc(x.slice(0,40)))+'<span class="pii-gap">…</span>'+(last?'':esc(x.slice(-40))); };
  let h='', p=0; M.forEach((r,i)=>{ h+=cut(t.slice(p,r[0]), i===0, false)+'<mark class="pii-hit">'+esc(t.slice(r[0],r[1]))+'</mark>'; p=r[1]; }); h+=cut(t.slice(p), M.length===0, true);
  return h;
}

const KDOW=['일','월','화','수','목','금','토'];
function fmtD(d){ return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+'('+KDOW[d.getDay()]+')'; }
function calcDateLabel(label){
  const n=new Date(); let m;
  if((m=label.match(/^오늘 ([+-])(\d+)일$/))){ const d=new Date(n); d.setDate(d.getDate()+(m[1]==='-'?-1:1)*parseInt(m[2])); return fmtD(d); }

  if(label==='이번 달 말일'){ return fmtD(new Date(n.getFullYear(),n.getMonth()+1,0)); }
  if(label==='다음 달 1일'){ return fmtD(new Date(n.getFullYear(),n.getMonth()+1,1)); }
  return null;
}

/* ---- 스트리밍 (LNK-14: 실시간 출력·중지) ---- */
function streamInto(c, i, full, isRegen){ markBusy(60*1000); const _m=c.msgs[i]; if(_m) _m._streamStart=Date.now();
  if(state.streaming) return;
  state.streaming={cid:c.id, i};
  const plain=full.replace(/<[^>]+>/g,'');
  c.msgs[i].text= c.msgs[i].mrec ? '' : '';
  renderChat(!isRegen);
  const sb=$('#sendBtn'); if(sb){ sb.classList.add('stop'); sb.innerHTML=ic('stop',15); sb.title='생성 중지'; }
  const box=$('#msgs'); const bubbles=box?box.querySelectorAll('.msg.ai .bubble'):[];
  const target=bubbles[bubbles.length-1];
  let p=0; const step=Math.max(3,Math.round(plain.length/46));
  const timer=setInterval(()=>{
    if(!state.streaming){ clearInterval(timer); finish(true); return; }
    p=Math.min(plain.length,p+step);
    if(target){ const near=box.scrollHeight-box.scrollTop-box.clientHeight<120; target.classList.add('streaming'); target.textContent=plain.slice(0,p); if(near) box.scrollTop=box.scrollHeight; }
    if(p>=plain.length){ clearInterval(timer); finish(false); }
  },40);
  function finish(stopped){
    state.streaming=null;
    c.msgs[i].text = stopped ? (c.msgs[i].mrec? plain.slice(0,p)+'\n…(중지됨)' : '<p>'+esc(plain.slice(0,p))+' …(중지됨)</p>') : full;
    renderChat();
    if(isRegen) toast('답변을 다시 생성했습니다','redo');
  }
}
function stopStream(){ if(state.streaming){ state.streaming=null; toast('생성을 중지했습니다 · 여기까지의 내용은 보존됩니다','stop'); } }

/* ---- GRD-11 점검 공통 ---- */
function grdCheckHtml(id){
  return '<div class="sim-result" id="'+id+'" style="margin-top:12px">'+

/* 공유 전 개인정보 점검 · 실제 대화 내용에서 찾은 것만 보여 준다 */
function grdScan(text){
  const t=String(text||'').replace(/<[^>]+>/g,' ');
  const out=[]; PII_RX.forEach(p=>{ const m=t.match(p.rx); if(m) out.push({name:p.name,n:m.length}); });
  const nm=t.match(/[가-힣](○|O|●){1,2}[가-힣]?(?=\s|\/|\(|,|·|$)/g); if(nm) out.push({name:'환자 이름(일부 가림)',n:nm.length});
  const ward=t.match(/\d{2,3}병동/g); if(ward) out.push({name:'병동 정보',n:ward.length});
  return out;
}
function maskShare(t){ return maskPII(String(t||'')).replace(/([가-힣])(○|O|●){1,2}([가-힣]?)(?=\s|\/|\(|,|·|$)/g,'●●●').replace(/\d{2,3}병동/g,'●●병동'); }
function grdFinish(w,id,onPass,text){

function openArtifact(){
  const el=$('#artifactPanel'); if(!el) return;
  el.classList.add('on'); state.artifactVer='v2'; drawArt();
}
function drawArt(){
  const el=$('#artifactPanel'); const cur=ARTV.find(x=>x.v===state.artifactVer)||ARTV[0]; state.artifactVer=cur.v;
  const idx=ARTV.indexOf(cur), prev=ARTV[idx+1];
  const cmp=!!state.artifactCmp && cur.changes && prev;
  const plainLen=cur.html.replace(/<[^>]+>/g,'').length;
  const verSel='<div class="art-ver" data-dd><button class="av-btn" onclick="openArtVerDD(event)"><b>'+cur.v+'</b><span>'+cur.tag+'</span>'+ic('chev',11)+'</button></div>';
  el.innerHTML=
   '<div class="art-h">'+ic('doc',15)+'<b>근거 보고서</b>'+verSel+
    (cur.changes&&prev?'<button class="av-cmp'+(cmp?' on':'')+'" onclick="state.artifactCmp=!state.artifactCmp;drawArt()" title="'+prev.v+' → '+cur.v+' 사이에 무엇이 바뀌었는지">'+ic('history',12)+' 바뀐 내용 '+cur.changes.length+'곳</button>':'')+
    '<button class="icon-btn" style="margin-left:auto" onclick="closeArtifact()">'+ic('x',15)+'</button></div>'+
   '<div class="art-b">'+
    (cmp?'<div class="art-cmp"><div class="ac-h">'+prev.v+' → '+cur.v+' · 바뀐 부분만 모았어요 <span style="font-weight:400;color:var(--ink3)">· 항목을 누르면 내용이 펼쳐져요</span></div>'+
       cur.changes.map((c,i)=>'<details class="ac-item"'+(i===0?' open':'')+'><summary><span class="chip '+(c.type==='신설'?'brand':'res')+'">'+c.type+'</span><b>'+esc(c.sec)+'</b>'+ic('chev',11)+'</summary><div class="ac-body">'+c.html+'</div></details>').join('')+
       '<div style="font-size:13px;color:var(--ink3);margin-top:8px">바뀌지 않은 항목(1. 배경)은 생략했어요</div></div>':'')+
    '<div class="art-doc" id="artDoc">'+cur.html+'</div></div>'+
   '<div class="art-f"><span style="font-size:12.5px;color:var(--ink3)">'+ic('info',11)+' '+cur.d+' · '+esc(dispName(cur.by))+' · 이 대화에 남아요</span>'+
    '<div class="art-ver" data-dd style="margin-left:auto"><button class="btn sec sm" onclick="openArtCopyDD(event,'+plainLen+')">'+ic('copy',12)+'복사 · 저장'+ic('chev',10)+'</button></div>'+
    '</div>';
  const doc=el.querySelector('#artDoc');
  doc.onmouseup=()=>{
    const sel=window.getSelection(); const t=sel.toString().trim();
    document.querySelectorAll('.sel-edit').forEach(x=>x.remove());
    if(t.length>3){
      const r=sel.getRangeAt(0).getBoundingClientRect();
      const tip=document.createElement('div'); tip.className='sel-edit';
      tip.style.left=Math.max(8,r.left)+'px'; tip.style.top=(r.top-40)+'px';
      tip.innerHTML='<button onclick="selFix(\'짧게\')">짧게</button><button onclick="selFix(\'쉬운 말로\')">쉬운 말로</button><button onclick="selFix(\'근거 추가\')">근거 추가</button>';
      document.body.appendChild(tip);
      setTimeout(()=>document.addEventListener('mousedown',()=>tip.remove(),{once:true}),50);
    }
  };
}
function selFix(how){
  document.querySelectorAll('.sel-edit').forEach(x=>x.remove());
  toast('선택 부분을 “'+how+'” 방향으로 고친 v3 초안을 만들었습니다 · 나머지는 그대로 유지','edit');
}
function reportFileName(){ const c=curConvo(); const t=c?c.title.replace(/[\\/:*?"<>|]/g,' ').trim():'보고서'; return '근거보고서_'+t+'_'+state.artifactVer+'.md'; }
function addReportToProject(){
  const c=curConvo(); if(!c) return;
  const put=(pid)=>{ const pj=PROJECTS.find(x=>x.id===pid); if(!pj) return; const n=reportFileName(); if(!pj.files.some(f=>f.n===n)) pj.files.push({n, gen:true, from:c.title}); toast('\u201C'+pj.name+'\u201D 프로젝트에 추가했어요 · 그 프로젝트 안 대화에서 참조할 수 있어요','folder'); };
  if(c.project){ put(c.project); return; }
  const w=openModal(mh('프로젝트에 추가','folder','<span class="num">'+esc(reportFileName())+'</span>')+'<div class="modal-b"><p style="font-size:14px;color:var(--ink2);margin:0 0 10px;line-height:1.7">이 대화는 프로젝트에 속해 있지 않아요. 보고서를 넣을 프로젝트를 고르세요. 대화 자체는 옮기지 않습니다.</p><div class="radio-cards" id="rpP" style="grid-template-columns:1fr;gap:6px">'+
   PROJECTS.map((p,i)=>'<button data-p="'+p.id+'" class="'+(i===0?'on':'')+'"><b>'+ic('folder',12)+' '+esc(p.name)+'</b><span style="font-size:12.5px;color:var(--ink3)">파일 '+p.files.length+'개</span></button>').join('')+'</div></div>'+
   '<div class="modal-f"><button class="btn sec" onclick="closeModal(this)">취소</button><button class="btn pri" id="rpOk">추가</button></div>');
  w.querySelectorAll('#rpP button').forEach(b=>b.onclick=()=>{ w.querySelectorAll('#rpP button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
  w.querySelector('#rpOk').onclick=()=>{ const sel=w.querySelector('#rpP button.on'); closeModal(w.querySelector('#rpOk')); if(sel) put(sel.dataset.p); };
}
function openArtVerDD(e){
  const p=ddAt(e,260);

function openArtCopyDD(e,len){
  const p=ddAt(e,250);
  const sel=(window.getSelection()||{toString:()=>''}).toString().trim();
  p.innerHTML=
   ddItem('copy','전체 복사 <span style="font-weight:400;color:var(--ink3)">· 약 '+len.toLocaleString()+'자</span>',"copyText(document.getElementById('artDoc').innerText,'보고서')")+

   ddItem('down','파일로 저장 (Markdown · PDF)',"exportArtifact()");

function exportArtifact(){
  const w=openModal(mh('보고서 파일로 저장','down')+'<div class="modal-b"><div class="ex-grid" style="grid-template-columns:1fr 1fr" id="axF">'+
   '<button class="ex-card on" data-f="Markdown"><b>Markdown <span class="num" style="font-weight:500;color:var(--ink3)">.md</span></b><span class="ex-d">제목·굵게 서식이 남는 문서 파일 · 메모 앱에 붙일 때</span></button>'+
   '<button class="ex-card" data-f="PDF"><b>PDF <span class="num" style="font-weight:500;color:var(--ink3)">.pdf</span></b><span class="ex-d">인쇄·보고용 · 어디서 열어도 같은 모양</span></button></div></div>'+
   '<div class="modal-f"><button class="btn sec" onclick="closeModal(this)">취소</button><button class="btn pri" id="axGo">'+ic('down',13)+'저장</button></div>');
  let f='Markdown'; w.querySelectorAll('#axF button').forEach(b=>b.onclick=()=>{ w.querySelectorAll('#axF button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); f=b.dataset.f; });

function closeArtifact(){ const el=$('#artifactPanel'); if(el){ el.classList.remove('on'); el.innerHTML=''; } }

function tokensKo(t){ return (t||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(x=>x.length>=2); }
function findSimilar(name, body){
  const q=new Set([...tokensKo(name),...tokensKo(body)]); if(q.size<1) return [];
  const score=(txt)=>{ const t=tokensKo(txt); if(!t.length) return 0; let hit=0; q.forEach(w=>{ if(t.some(x=>x.includes(w)||w.includes(x))) hit++; }); return hit/q.size; };
  const cands=[...(S3?AGENTS:[]).map(a=>({kind:'agent',id:a.id,name:a.name,desc:a.desc,by:a.by,sc:Math.max(score(a.name)*1.5,score(a.name+' '+a.desc+' '+(a.usage||'')))})),
               ...PROMPTSETS.filter(p=>!p.owner.includes('(나)')).map(p=>({kind:'ps',id:p.id,name:p.name,desc:p.desc,by:p.owner,sc:Math.max(score(p.name)*1.5,score(p.name+' '+p.desc+' '+(p.prompt||'')))}))];
  return cands.filter(c=>c.sc>=0.45).sort((a,b)=>b.sc-a.sc).slice(0,3);
}

function locateKBDoc(docName){
  const key=(docName||'').split(' ')[0].slice(0,4);
  const hitKb=KBS.find(k=>k.docs.some(d=>d.n.includes(key)))||KBS[0];
  if(hitKb){ ragSel=hitKb.id; ragDocOpen=null; }
  openView('rag');
  setTimeout(()=>{
    const rows=[...document.querySelectorAll('#kbDetail .kb-doc')];
    const hit=rows.find(c=>c.textContent.includes(key))||rows[0];
    if(hit){ hit.classList.add('hl'); hit.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>hit.classList.remove('hl'),2400); }
  },200);
}

let myPeriod='7d'; let dashPeriod='day';
function trendRows(){
  const dn=['일','월','화','수','목','금','토'];
  let rows=[];
  if(dashPeriod==='day'){
    const wk=[15800,17300,14100,16200,18200]; let wi=0;
    for(let i=6;i>=0;i--){ const d=new Date(Date.now()-i*864e5); const g=d.getDay();
      const v=(g===0)?2100:(g===6)?3400:wk[wi++%wk.length];
      rows.push([(d.getMonth()+1)+'/'+d.getDate()+'('+dn[g]+')', i===0?12400:v, i===0]); }
  } else if(dashPeriod==='week'){
    for(let i=7;i>=0;i--){ const d=new Date(Date.now()-i*7*864e5);
      const wom=Math.ceil(d.getDate()/7);
      rows.push([(d.getMonth()+1)+'월 '+wom+'주차', 68000+((i*37)%5)*6200+(i===0?-21000:0), i===0]); }
  } else {
    for(let i=5;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i);
      rows.push([(d.getMonth()+1)+'월', 210000+((i*53)%6)*31000+(i===0?-96000:0), i===0]); }
  }
  return trendLine(rows);
}
function trendLine(rows){
  const W=620, H=182, padL=30, padR=44, padT=28, padB=38;
  const maxV=Math.max(...rows.map(r=>r[1]))*1.15;
  const n=rows.length;
  const x=i=>padL+ i*(W-padL-padR)/(n-1);
  const y=v=>padT+ (1-v/maxV)*(H-padT-padB);
  const pts=rows.map((r,i)=>[x(i), y(r[1])]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=line+' '+(W-padR)+','+(H-padB)+' '+padL+','+(H-padB);
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:100%;min-height:260px;max-height:200px;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-label="사용량 추이">'+
   [0.25,0.5,0.75,1].map(f=>'<line x1="'+padL+'" y1="'+y(maxV*f)+'" x2="'+(W-padR)+'" y2="'+y(maxV*f)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>').join('')+
   '<polygon points="'+area+'" fill="var(--brand)" opacity=".07"/>'+
   '<polyline points="'+line+'" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
   rows.map((r,i)=>{
     const cur=r[2];
     return '<circle cx="'+pts[i][0]+'" cy="'+pts[i][1]+'" r="'+(cur?5:3.4)+'" fill="'+(cur?'var(--brand)':'var(--paper)')+'" stroke="var(--brand)" stroke-width="2"><title>'+esc(r[0])+' · '+r[1].toLocaleString()+' tok</title></circle>'+
      ((cur||i===0||r[1]===Math.max(...rows.map(q=>q[1])))?'<text x="'+pts[i][0]+'" y="'+(pts[i][1]-10)+'" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)" class="num">'+(r[1]>=10000?(Math.round(r[1]/1000)+'k'):r[1].toLocaleString())+'</text>':'')+
      ((n>7 && !cur && i%2===1)?'':'<text x="'+pts[i][0]+'" y="'+(H-12)+'" text-anchor="'+(i===0?'start':(i===n-1?'end':'middle'))+'" font-size="11.5" fill="'+(cur?'var(--brand-deep)':'var(--ink2)')+'" '+(cur?'font-weight="800"':'font-weight="600"')+'>'+esc(r[0])+'</text>');
   }).join('')+
  '</svg>';
}

function toggleMcpOn(id){
  const m=MCPS.find(x=>x.id===id); if(!m) return;
  m.on=!m.on;
  if(!m.on && state.activeMcp && state.activeMcp.sv===m.name){ state.activeMcp=null; }
  renderAdmin();
  toast(m.on?'\u201C'+m.name+'\u201D 연결됨 · 대화 [사내 도구]에 표시됩니다':'\u201C'+m.name+'\u201D 연결 해제 · 대화에서 숨겨집니다', m.on?'check':'x');
}
function tryMcp(mid, tn){
  const m=MCPS.find(x=>x.id===mid);
  if(m && !m.on){ toast('연결이 꺼진 커넥터입니다 · 오른쪽 위 스위치로 먼저 연결하세요','alert'); return; }

  openView('chat');
  setTimeout(()=>{ const ta=$('#compTa'); if(ta){ ta.placeholder='질문을 입력하면 '+tn+' 도구를 호출해 답합니다'; ta.focus(); } }, 100);

function decidePromo(i,ok,reason){
  if(ok&&PROMOS[i].reReview&&PROMOS[i].agentId){ const a=AGENTS.find(x=>x.id===PROMOS[i].agentId); if(a&&a.draft){ const d=a.draft, nv=promoteVer(a.ver); a.history=a.history||[]; a.history.unshift({v:nv, d:nowStamp(), by:'운영 관리자', fields:(d.changed||[]).map(c=>c.split(' ')[0]), note:'재심사 승인 · '+(d.note||d.changed.join(' · ')), prev:{name:a.name, desc:a.desc, usage:a.usage, prompt:a.prompt, tools:(a.tools||[]).slice(), kb:a.kb, scope:a.scope||'-', samples:(a.samples||[]).slice()}}); Object.assign(a,{name:d.name, desc:d.desc, usage:d.usage, prompt:d.prompt, kb:d.kb, ver:nv, verNote:d.note||'', newVer:true}); if(PROMOS[i].qset) a.qset=Object.assign({},PROMOS[i].qset,{ver:nv}); delete a.draft; delete a.pendingVer; } }
  if(!ok&&PROMOS[i].reReview&&PROMOS[i].agentId){ const a=AGENTS.find(x=>x.id===PROMOS[i].agentId); if(a){ delete a.pendingVer; } }
  if(ok&&!PROMOS[i].reReview){ const ps=PROMPTSETS.find(p=>p.name===PROMOS[i].ps); if(ps){ const nv=promoteVer(ps.ver); ps.history=ps.history||[]; ps.history.unshift({v:nv,d:nowMD(),by:'운영 관리자',diff:{del:'-',add:'프롬프트 마켓 게시 승인 · '+ps.ver+' → '+nv}}); ps.ver=nv; if(PROMOS[i].qset) ps.qset=Object.assign({},PROMOS[i].qset,{ver:nv}); if(!S3&&(!ps.scope||ps.scope==='비공개')) ps.scope=PROMOS[i].scope||'부서'; } }
  logHandle('게시 심사 '+(ok?'승인':'반려')+' · '+PROMOS[i].ps+(reason?' · '+reason:''));
  PROMOS[i].status = ok?'게시 승인':'반려';
  if(PROMOS[i].by.includes('정민호')){
    NOTIS.unshift({icon:ok?'check':'x', bg:ok?'var(--brand-soft)':'var(--danger-soft)', c:ok?'var(--brand)':'var(--danger)',
     b:'“'+esc(PROMOS[i].ps)+'” '+(S3?'에이전트 승격':'게시 신청')+' <b>'+PROMOS[i].status+'</b>', t:'방금', at:nowStamp(), go:()=>openView('mkt')});
    renderNotiBadge();

  renderAdmin();
}

     (EXPORTS.length?'<table class="tbl"><colgroup><col><col style="width:110px"><col style="width:70px"><col style="width:90px"><col style="width:170px"></colgroup><thead><tr><th>파일</th><th>내보낸 시각</th><th class="ta-r">크기</th><th>삭제 예정</th><th></th></tr></thead><tbody>'+EXPORTS.map((f,i)=>'<tr><td>'+attChip({name:f.n,size:''},null)+'</td><td class="num">'+f.d+'</td><td class="num ta-r">'+f.sz+'</td><td class="num">'+f.exp+'</td><td class="ta-r" style="white-space:nowrap"><span style="display:inline-flex;gap:6px;align-items:center"><button class="btn sec sm" onclick="toast(\'다시 내려받기 · '+esc(f.n)+'\',\'down\')">'+ic('down',12)+'다운로드</button><button class="icon-btn" title="지금 삭제" onclick="EXPORTS.splice('+i+',1);this.closest(\'.modal-wrap\')._draw();toast(\'삭제했어요\',\'trash\')">'+ic('trash',13)+'</button></span></td></tr>').join('')+'</tbody></table>':'<div class="q-empty" style="color:var(--ink3)">'+ic('down',22)+'<div>내보낸 파일이 없어요</div></div>');
  } else if(stTab==='account'){
    h='<h4>계정</h4><p class="st-desc">Knox 계정 정보는 인사 시스템 기준이라 여기서 바꿀 수 없어요</p><div class="kv-list" style="border-top:none">'+[['이름',USER.name],['소속',USER.dept],['직급',USER.job],['역할',USER.role],['로그인','Knox SSO · 오늘 08:52'],['이번 달 배정',USER.budgetMonth.toLocaleString()+' 토큰']].map(r=>'<div class="kv"><span class="kv-k">'+r[0]+'</span><span class="kv-v">'+esc(r[1])+'</span></div>').join('')+'</div>'+
     '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn sec sm" onclick="closeModal(this);openMyReports()">'+ic('flag',12)+'내 요청 현황</button><button class="btn sec sm" onclick="closeModal(this);lockScreen(\'직접\')">'+ic('lock',12)+'지금 잠그기</button></div>';
  }
  m.innerHTML=h;
  const bind=(id,fn)=>m.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{ m.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); fn(b.dataset.v); applyPrefs(); });
  bind('stFont',v=>s.font=+v); bind('stLine',v=>s.lineh=+v); bind('stWidth',v=>{ s.widthPx=+v; s.width=({760:'좁게',860:'보통',1080:'넓게'})[v]; }); bind('stOut',v=>s.out=v); bind('stTheme',v=>{ s.theme=v; document.documentElement.dataset.theme=v==='auto'?'':v; });
}
const SHORTCUT_DEFAULTS=[['새 대화','Ctrl+Shift+O'],['대화 검색','Ctrl+K'],['모델 선택','Ctrl+M'],['모드 전환','Ctrl+.'],['전송','Enter'],['줄바꿈','Shift+Enter'],['답변 중지','Esc'],['지금 잠그기','Ctrl+Shift+L']];
function rebindKey(i,btn){
  const cell=document.getElementById('kb'+i); cell.textContent='키를 누르세요…'; cell.classList.add('wait');
  const h=e=>{ e.preventDefault(); if(['Control','Shift','Alt','Meta'].includes(e.key)) return; const combo=(e.ctrlKey?'Ctrl+':'')+(e.altKey?'Alt+':'')+(e.shiftKey?'Shift+':'')+(e.key.length===1?e.key.toUpperCase():e.key); state.shortcuts[i][1]=combo; cell.textContent=combo; cell.classList.remove('wait'); document.removeEventListener('keydown',h,true); toast(state.shortcuts[i][0]+' → '+combo,'check'); };
  document.addEventListener('keydown',h,true);
}
/* ================= 통합 검색 (Ctrl+K) · 대화 · 문서 · 프롬프트셋 · 게시글 ================= */
function openGlobalSearch(){
  closePops();
  const w=openModal('<div class="gs"><div class="gs-in">'+ic('search',16)+'<input id="gsQ" placeholder="대화 · 문서 · 프롬프트셋 · 게시글 검색 · Esc 닫기"><span class="kbd">Ctrl+K</span></div><div class="gs-res" id="gsRes"></div></div>','gs-modal');
  w.dataset.nodirty='1';
  const inp=w.querySelector('#gsQ'), res=w.querySelector('#gsRes');
  const draw=()=>{
    const q=inp.value.trim().toLowerCase();
    if(!q){ res.innerHTML='<div class="gs-hint">최근 대화</div>'+CONVOS.slice(0,4).map(c=>'<button class="gs-row" onclick="closeModal(this);navTo(\'chat\');openConvo(\''+c.id+'\')">'+ic('chat',13)+'<span>'+esc(c.title)+'</span><small>'+esc(c.updated||c.d||'')+'</small></button>').join(''); return; }
    const hit=t=>(t||'').toLowerCase().includes(q);
    const groups=[
      ['대화',CONVOS.filter(c=>hit(c.title)||c.msgs.some(m=>hit(m.text))).slice(0,4).map(c=>['chat',c.title,c.updated||c.d||'',"navTo('chat');openConvo('"+c.id+"')"])],
      ['문서',KBS.flatMap(k=>k.docs.filter(d=>hit(d.n)).map(d=>['doc',d.n,k.name,"navTo('rag');ragLayer='all';ragSel='"+k.id+"';ragDocOpen='"+esc(d.n)+"';renderRAG()"])).slice(0,4)],
      ['프롬프트셋',PROMPTSETS.filter(p=>hit(p.name)||hit(p.desc)).slice(0,4).map(p=>['prompt',p.name,p.owner,"openPS('"+p.id+"')"])],
      ['게시글',Object.entries(BOARDS).flatMap(([tab,arr])=>arr.map((p,i)=>({tab,i,p}))).filter(x=>hit(x.p.t)||hit(x.p.body)).slice(0,4).map(x=>['board',x.p.t,BRD_DEF[x.tab]?BRD_DEF[x.tab].n:x.tab,"navTo('brd');openPost('"+x.tab+"',"+x.i+")"])]
    ].filter(g=>g[1].length);
    res.innerHTML=groups.length?groups.map(g=>'<div class="gs-hint">'+g[0]+' <span>'+g[1].length+'</span></div>'+g[1].map(r=>'<button class="gs-row" onclick="closeModal(this);'+r[3]+'">'+ic(r[0],13)+'<span>'+esc(r[1])+'</span><small>'+esc(r[2])+'</small></button>').join('')).join(''):'<div class="gs-hint">“'+esc(inp.value)+'” 검색 결과가 없어요</div>';
  };
  let comp=false; inp.addEventListener('compositionstart',()=>comp=true); inp.addEventListener('compositionend',()=>{comp=false;draw();}); inp.addEventListener('input',e=>{ if(!comp&&!e.isComposing) draw(); });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const b=res.querySelector('.gs-row'); if(b) b.click(); } });
  draw(); setTimeout(()=>inp.focus(),30);
}

/* ---- 단축키 · 초기화 ---- */
document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('inapp')) return;
  if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='o'){ e.preventDefault(); openView('chat'); newChat(); }
  else if(e.ctrlKey&&e.key.toLowerCase()==='k'){ e.preventDefault(); openGlobalSearch(); }
  else if(e.ctrlKey&&e.key.toLowerCase()==='m'){ e.preventDefault(); const b=document.querySelector('.model-sw'); if(b) b.click(); }
  else if(e.ctrlKey&&e.key==='.'){ e.preventDefault(); openModeModal(); }
  else if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='i')){e.preventDefault();toggleIds();return;}
  else if(e.ctrlKey&&e.shiftKey&&(e.key==='X'||e.key==='x')){e.preventDefault();toggleScr();return;}
  else if(e.ctrlKey&&e.shiftKey&&(e.key==='L'||e.key==='l')){e.preventDefault();lockScreen('직접');return;}
  if(e.ctrlKey&&e.shiftKey&&(e.key==='P'||e.key==='p')){e.preventDefault();toggleScope();return;}
  if(e.key==='Escape'){ if(state.streaming) stopStream(); closePops(); if(document.getElementById('notiDrawer')){ closeNoti(); return; } const ws=[...document.querySelectorAll('.modal-wrap:not(.closing)')]; if(ws.length) closeWrap(ws[ws.length-1]); }
});
/* 매뉴얼 임베드용 해시 라우터: #demo=view&mode=clin&ids=off */
document.body.classList.add('hide-ids'); /* 기본은 깨끗한 화면 · 로고 더블클릭 또는 Ctrl+Shift+I로 명세 ID 표시 */
(function(){
  const h=location.hash.replace('#','');
  if(!h.includes('demo=')) return;
  const p=Object.fromEntries(h.split('&').map(x=>x.split('=')));
  setTimeout(()=>{
    doLogin();
    if(p.mode && MODES[p.mode]){ state.mode=p.mode; applyMode(); renderChat(); }
    if(p.demo && p.demo!=='chat'){ if(p.demo==='ps'){ mktSub='mine'; openView('mkt'); } else openView(p.demo); }
    if(p.ids==='off') document.body.classList.add('hide-ids');
  }, 60);
})();

/* ── 비활성 버튼 규칙: 눌리지 않는 대신, 누르면 이유를 알려주고 해당 칸으로 이동 ── */
(function(){
  const D=Object.getOwnPropertyDescriptor(HTMLButtonElement.prototype,'disabled');
  Object.defineProperty(HTMLButtonElement.prototype,'disabled',{configurable:true,
    get(){ return this.getAttribute('aria-disabled')==='true'; },
    set(v){ if(v) this.setAttribute('aria-disabled','true'); else this.removeAttribute('aria-disabled'); if(this.hasAttribute('disabled')) this.removeAttribute('disabled'); }});
  const conv=window._convDisabled=root=>{ if(!root||!root.querySelectorAll) return; if(root.tagName==='BUTTON'&&root.hasAttribute('disabled')){ root.removeAttribute('disabled'); root.setAttribute('aria-disabled','true'); } root.querySelectorAll('button[disabled]').forEach(b=>{ b.removeAttribute('disabled'); b.setAttribute('aria-disabled','true'); }); };
  const mo=new MutationObserver(ms=>ms.forEach(m=>{ if(m.type==='attributes'){ if(m.target.tagName==='BUTTON'&&m.target.hasAttribute('disabled')) conv(m.target); } else m.addedNodes.forEach(n=>conv(n)); }));
  const start=()=>{ conv(document.body); mo.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']}); };
  if(document.body) start(); else document.addEventListener('DOMContentLoaded',start);
  document.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('button[aria-disabled="true"]'); if(!b) return;
    e.preventDefault(); e.stopImmediatePropagation();
    const t=(b.textContent||'').trim();
    if(b.querySelector('.live-dot')||/중…$/.test(t)){ toast('처리 중이에요 · 잠시만 기다려 주세요','clock'); return; }
    if(/^(이전|다음)$/.test(t)&&!b.closest('.pub-foot')) { toast(t==='이전'?'첫 페이지예요':'마지막 페이지예요','info'); return; }
    const why=b.dataset.why||'';
    const scope=b.closest('.modal')||b.closest('.page-form')||b.closest('.card')||document;
    let target=null, label='';
    scope.querySelectorAll('label.req').forEach(l=>{ if(target) return; const f=l.closest('.fld')||l.parentElement; const inp=f&&f.querySelector('input:not([type=hidden]):not([type=checkbox]),textarea,select'); if(inp&&!String(inp.value||'').trim()){ target=inp; label=l.textContent.replace(/\*|\(.*?\)/g,'').split('·')[0].trim(); } });
    if(why){ toast(why,'alert'); }
    else if(target){ toast('‘'+label+'’을(를) 입력해 주세요','alert'); }
    else if(b.title&&!/^(\s*)$/.test(b.title)){ toast(b.title,'alert'); }
    else toast('필요한 항목을 먼저 채우거나 골라 주세요','alert');
    if(target){ target.focus(); target.scrollIntoView&&target.scrollIntoView({block:'center',behavior:'smooth'}); target.classList.add('need'); setTimeout(()=>target.classList.remove('need'),1600); }
  },true);
})();
